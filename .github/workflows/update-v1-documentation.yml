name: Update V1 documentation

on:
  push:
    branches:
      - agent/v1-production-completion
    paths:
      - .github/workflows/update-v1-documentation.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-v1-documentation
  cancel-in-progress: false

jobs:
  document:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/v1-production-completion
          fetch-depth: 0
      - name: Synchronize README, invariants, changelog and release notes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def append_once(path: Path, marker: str, section: str) -> None:
              text = path.read_text() if path.exists() else ""
              if marker in text:
                  return
              separator = "\n" if text.endswith("\n") or not text else "\n\n"
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(text + separator + section.strip() + "\n")

          append_once(
              Path("README.md"),
              "<!-- veyra-v1-contract -->",
              r'''
<!-- veyra-v1-contract -->
## Veyra V1 contract

Veyra is a deterministic Rust projection and search engine for Booking Asia. PostgreSQL remains
**authoritative** for inventory, restrictions, and checkout price; Veyra returns bounded advisory
search projections that must be revalidated by the booking transaction.

The V1 workspace includes:

- PostgreSQL logical-replication decoding, transaction assembly, journal/checkpoint recovery, and
  monotonic projection progress;
- immutable segment storage, availability indexing, atomic runtime generations, and typed health;
- validated party graphs, age-at-check-in semantics, rule compilation, occupancy, restrictions,
  fixed-point pricing, deterministic ranking, and explicit room topology;
- exact bounded multi-room allocation grouped by property, with actual occupancy-dependent pricing;
- typed single-room and multi-room query paths plus an HTTP service boundary.

V1 fails closed when projection state is missing or malformed, the runtime is not `Ready`, a hard
constraint cannot be proven, a price lies outside the projected horizon, a property exceeds the
exact room bound, or the configured solver state/solution budget cannot prove an optimum.

### Local verification

```bash
cargo fmt --all -- --check
cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
cargo test --workspace --all-features --locked
cargo build --workspace --release --all-features --locked
```

The release decision is made only by `.github/workflows/v1-final-qualification-v2.yml` on the exact
candidate SHA. It additionally enforces five-platform portability, nextest, production coverage of
at least 99% for lines/functions/regions, cargo-deny, cargo-audit, rustdoc warnings, Miri, fuzz smoke,
and release packaging. A result from a different SHA is not release evidence.

Operational and security details are documented in:

- `docs/architecture/v1-threat-model.md`
- `docs/architecture/v1-production-runbook.md`
''',
          )

          append_once(
              Path("docs/invariants/core.md"),
              "<!-- veyra-v1-enforced-invariants -->",
              r'''
<!-- veyra-v1-enforced-invariants -->
## V1 enforced invariants

### Projection and serialization

- Published progress is monotonic and satisfies `published <= applied <= durable <= received`.
- Projected transaction positions satisfy `begin <= commit <= end`.
- Serde input is validated through explicit conversion boundaries; deserialization cannot bypass
  those order constraints.
- A checkpoint is not acknowledged as durable before the durable state transition succeeds.
- Only complete committed transactions may become visible in a published generation.

### Runtime and query admission

- A runtime snapshot serves queries only in phase `Ready`.
- Generations are immutable after publication and swapped atomically.
- Missing, stale, malformed, or unsupported projection semantics produce an explicit refusal rather
  than a guessed result.

### Parties, rooms, topology, and pricing

- A multi-room solution is contained within one property.
- Hard rooming constraints are evaluated before ranking.
- `Near`, `AdjacentRooms`, and `ConnectedRooms` require explicit projected topology edges; identifiers
  and room numbers are never treated as proof.
- Candidate room width, travelers, solver states, valid solutions, stay length, and result count are
  bounded. Exceeding a proof bound is an error, not silent truncation.
- Projected money uses checked fixed-point integers. Final room price is computed from the occupancy
  actually assigned by the exact solver.

### Authority

Veyra search output is advisory. PostgreSQL and the Booking Asia booking transaction must revalidate
availability, restrictions, and final price before accepting a reservation.
''',
          )

          append_once(
              Path("CHANGELOG.md"),
              "<!-- veyra-v1-rc -->",
              r'''
# Changelog

<!-- veyra-v1-rc -->
## V1 release candidate

### Added

- Durable PostgreSQL CDC projection with bounded decoding, transaction recovery, checkpoints, and
  immutable segment publication.
- Deterministic availability, party/rule/occupancy/restriction/pricing/ranking pipeline.
- Exact multi-room solver with property isolation, explicit topology, bounded proof budgets, and
  occupancy-dependent fixed-point pricing.
- Atomic query-ready runtime generations and typed HTTP query boundary.
- Threat model, production runbook, serialized-invariant regressions, cross-platform qualification,
  >=99% production coverage gate, Miri, fuzz, dependency policy, and release artifact checksums.

### Security

- Validated deserialization for runtime/CDC LSN ordering.
- Query admission restricted to the `Ready` runtime phase.
- Fail-closed handling for unknown topology, missing projections, invalid ranges, oversized bounded
  inputs, malformed JSON, wrong methods, and unsupported hard constraints.

### Compatibility

Veyra remains an advisory projection. Booking Asia/PostgreSQL is authoritative at checkout; no V1
API promises authoritative reservation acceptance from a search response.
''',
          )

          release = Path("docs/releases/v1-release-candidate.md")
          if not release.exists():
              release.parent.mkdir(parents=True, exist_ok=True)
              release.write_text(r'''# Veyra V1 Release Candidate

## Release scope

This candidate delivers the deterministic Veyra projection, exact bounded multi-room search path,
query-ready runtime, and HTTP service boundary described in the V1 contract.

## Qualification requirements

The exact candidate SHA must pass:

- locked workspace and fuzz dependency resolution;
- formatting, full-workspace clippy with warnings denied, workspace tests, nextest, and release tests;
- Ubuntu x86_64, Ubuntu ARM64, Windows x86_64, macOS Intel, and macOS ARM64 jobs;
- >=99% production lines, functions, and regions under the documented denominator;
- cargo-deny, cargo-audit, rustdoc warnings, Miri core checks, and fuzz smoke;
- reproducible release packaging and SHA-256 checksum generation.

The PR stays Draft whenever the latest exact-SHA qualification fails or is incomplete.

## Known operational boundary

Search output is intentionally advisory and may lag the authoritative commit. Checkout must revalidate
availability, restrictions, and price. Solver and query limits are hard proof/cost ceilings; requests
outside those limits are refused instead of approximated.
''')
          PY
      - name: Verify documented workspace still builds
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          cargo metadata --locked --format-version 1 > /dev/null
          cargo test --workspace --all-features --locked
      - name: Commit documentation and remove one-shot workflow
        shell: bash
        run: |
          git rm .github/workflows/update-v1-documentation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md CHANGELOG.md docs .github/workflows/update-v1-documentation.yml
          git commit -m "docs: synchronize V1 contract and release notes"
          git fetch origin agent/v1-production-completion
          git rebase origin/agent/v1-production-completion
          git push origin HEAD:agent/v1-production-completion
