name: Query region refactor once

on:
  push:
    branches:
      - agent/v1-production-completion
    paths:
      - .github/workflows/query-region-refactor-once.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/v1-production-completion
          fetch-depth: 0
      - run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - name: Apply behavior-preserving query simplifications
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/veyra-query/src/lib.rs')
          text = path.read_text()

          replacements = [
              (
                  '''        if query
                  .budget
                  .is_some_and(|budget| tagged.solution.total_price > budget)
              {
                  explain.budget_rejected_properties += 1;
                  continue;
              }
''',
                  '''        if let Some(budget) = query.budget
              && tagged.solution.total_price > budget
          {
              explain.budget_rejected_properties += 1;
              continue;
          }
''',
              ),
              (
                  '''    if query.budget.is_some_and(|budget| budget.get() < 0) {
        return Err(QueryError::NegativeBudget);
    }
    let party_size = query.party.travelers().len();
    if party_size == 0 || party_size > HARD_MAX_TRAVELERS {
''',
                  '''    if let Some(budget) = query.budget
        && budget.get() < 0
    {
        return Err(QueryError::NegativeBudget);
    }
    let party_size = query.party.travelers().len();
    if party_size == 0 || party_size > HARD_MAX_TRAVELERS {
''',
              ),
          ]
          for old, new in replacements:
              if new in text:
                  continue
              if text.count(old) != 1:
                  raise SystemExit('query replacement site not unique')
              text = text.replace(old, new, 1)

          old_compare = '''fn compare_multi_room_hits(
    left: &MultiRoomSearchHit,
    right: &MultiRoomSearchHit,
    profile: SolutionProfile,
) -> Ordering {
    let profile_order = match profile {
        SolutionProfile::Cheapest => left
            .projected_price
            .cmp(&right.projected_price)
            .then_with(|| left.rooms.len().cmp(&right.rooms.len()))
            .then_with(|| left.soft_penalty.cmp(&right.soft_penalty)),
        SolutionProfile::FewestRooms => left
            .rooms
            .len()
            .cmp(&right.rooms.len())
            .then_with(|| left.projected_price.cmp(&right.projected_price))
            .then_with(|| left.soft_penalty.cmp(&right.soft_penalty)),
        SolutionProfile::BestFamilyLayout => left
            .soft_penalty
            .cmp(&right.soft_penalty)
            .then_with(|| left.projected_price.cmp(&right.projected_price))
            .then_with(|| left.rooms.len().cmp(&right.rooms.len())),
    };
    profile_order
        .then_with(|| left.property_id.cmp(&right.property_id))
        .then_with(|| left.rooms.cmp(&right.rooms))
}
'''
          new_compare = '''fn compare_multi_room_hits(
    left: &MultiRoomSearchHit,
    right: &MultiRoomSearchHit,
    profile: SolutionProfile,
) -> Ordering {
    match profile {
        SolutionProfile::Cheapest => (
            left.projected_price,
            left.rooms.len(),
            left.soft_penalty,
            left.property_id,
            &left.rooms,
        )
            .cmp(&(
                right.projected_price,
                right.rooms.len(),
                right.soft_penalty,
                right.property_id,
                &right.rooms,
            )),
        SolutionProfile::FewestRooms => (
            left.rooms.len(),
            left.projected_price,
            left.soft_penalty,
            left.property_id,
            &left.rooms,
        )
            .cmp(&(
                right.rooms.len(),
                right.projected_price,
                right.soft_penalty,
                right.property_id,
                &right.rooms,
            )),
        SolutionProfile::BestFamilyLayout => (
            left.soft_penalty,
            left.projected_price,
            left.rooms.len(),
            left.property_id,
            &left.rooms,
        )
            .cmp(&(
                right.soft_penalty,
                right.projected_price,
                right.rooms.len(),
                right.property_id,
                &right.rooms,
            )),
    }
}
'''
          if new_compare not in text:
              if text.count(old_compare) != 1:
                  raise SystemExit('query comparator site not unique')
              text = text.replace(old_compare, new_compare, 1)

          path.write_text(text)
          PY
      - name: Verify refactor
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy -p veyra-query --all-targets --all-features --locked -- -D warnings
          cargo test -p veyra-query --all-features --locked
      - name: Publish verified refactor
        shell: bash
        run: |
          git rm .github/workflows/query-region-refactor-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor: simplify exact query comparison branches"
          git push origin HEAD:agent/v1-production-completion
