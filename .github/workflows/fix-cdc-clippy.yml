name: Fix CDC bounded conversions

on:
  push:
    branches:
      - agent/m0-foundation-ci
    paths:
      - .github/workflows/fix-cdc-clippy.yml

permissions:
  contents: write

concurrency:
  group: fix-cdc-bounded-conversions
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/m0-foundation-ci
          fetch-depth: 0
      - name: Patch only proven bounded conversions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/veyra-cdc/src/journal_v2.rs")
          text = path.read_text()
          replacements = {
              "        let payload_len_usize = payload_len as usize;": "        #[expect(\n            clippy::cast_possible_truncation,\n            reason = \"payload_len is rejected above 64 MiB, which fits every supported usize target\"\n        )]\n        let payload_len_usize = payload_len as usize;",
              "    let count = count as u32;": "    #[expect(\n        clippy::cast_possible_truncation,\n        reason = \"change count is rejected above 1,000,000, which is below u32::MAX\"\n    )]\n    let count = count as u32;",
              "            let len = bytes.len() as u32;": "            #[expect(\n                clippy::cast_possible_truncation,\n                reason = \"tuple bytes are rejected above 64 MiB, which is below u32::MAX\"\n            )]\n            let len = bytes.len() as u32;",
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one match for {old!r}, found {text.count(old)}")
              text = text.replace(old, new)
          path.write_text(text)
          PY
          cargo fmt --all -- --check || cargo fmt --all
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-features --locked
      - name: Commit verified fix and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/fix-cdc-clippy.yml
          git add crates/veyra-cdc/src/journal_v2.rs
          git config user.name "Veyra CI"
          git config user.email "120781817+eukalpia@users.noreply.github.com"
          git commit -m "fix(cdc): document bounded journal conversions"
          git push origin HEAD:agent/m0-foundation-ci
