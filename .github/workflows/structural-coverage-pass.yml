name: Verify structural coverage simplifications

on:
  push:
    branches:
      - agent/m0-foundation-ci

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    outputs:
      passed: ${{ steps.verify.outputs.passed }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/m0-foundation-ci
          fetch-depth: 0

      - name: Apply invariant-driven simplifications
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected 1 match, found {count}: {old[:80]!r}')
              p.write_text(text.replace(old, new))

          # Availability: validated dimensions prove dense-word indexes and all intermediate stay days.
          replace_once(
              'crates/veyra-availability/src/lib.rs',
              '''        let word = self\n            .words\n            .get_mut(index)\n            .ok_or(AvailabilityError::InternalBounds)?;\n''',
              '''        let word = &mut self.words[index];\n''',
          )
          replace_once(
              'crates/veyra-availability/src/lib.rs',
              '''        let first = self.day_slice(check_in)?;\n        // A positive stay proves both operations below cannot underflow or overflow.\n        let last_night = check_out - 1;\n        let _ = self.day_offset(last_night)?;\n        let mut result = first.to_vec();\n        for day in (check_in + 1)..check_out {\n            for (target, source) in result.iter_mut().zip(self.day_slice(day)?) {\n                *target &= *source;\n            }\n        }\n''',
              '''        let first_offset = self.day_offset(check_in)?;\n        // A positive stay proves the subtraction below cannot underflow.\n        let last_offset = self.day_offset(check_out - 1)?;\n        let mut result = self.day_slice_at(first_offset).to_vec();\n        for offset in (first_offset + 1)..=last_offset {\n            for (target, source) in result.iter_mut().zip(self.day_slice_at(offset)) {\n                *target &= *source;\n            }\n        }\n''',
          )
          replace_once(
              'crates/veyra-availability/src/lib.rs',
              '''        let slice = self.day_slice(day)?;\n        let word = (room_id / WORD_BITS) as usize;\n        let bit = room_id % WORD_BITS;\n        Ok(slice\n            .get(word)\n            .is_some_and(|value| value & (1_u64 << bit) != 0))\n    }\n\n    fn day_slice(&self, day: u32) -> Result<&[u64], AvailabilityError> {\n        let offset = self.day_offset(day)?;\n        let start = offset * self.words_per_day;\n        let end = start + self.words_per_day;\n        self.words\n            .get(start..end)\n            .ok_or(AvailabilityError::InternalBounds)\n    }\n''',
              '''        let offset = self.day_offset(day)?;\n        let slice = self.day_slice_at(offset);\n        let word = (room_id / WORD_BITS) as usize;\n        let bit = room_id % WORD_BITS;\n        Ok(slice[word] & (1_u64 << bit) != 0)\n    }\n\n    fn day_slice_at(&self, offset: usize) -> &[u64] {\n        let start = offset * self.words_per_day;\n        let end = start + self.words_per_day;\n        &self.words[start..end]\n    }\n''',
          )
          p = Path('crates/veyra-availability/src/lib.rs')
          text = p.read_text().replace('    SizeOverflow,\n', '').replace('    InternalBounds,\n', '')
          p.write_text(text)
          p = Path('crates/veyra-availability/tests/coverage.rs')
          text = p.read_text().replace('        AvailabilityError::SizeOverflow,\n', '').replace('        AvailabilityError::InternalBounds,\n', '')
          p.write_text(text)

          # Party age: date ordering and MAX_AGE prove the final arithmetic/cast bounds.
          replace_once(
              'crates/veyra-party/src/lib.rs',
              '''        if (date.month, date.day) < (self.month, self.day) {\n            years = years.checked_sub(1).ok_or(PartyError::AgeOutOfRange)?;\n        }\n        if years > i32::from(MAX_AGE) {\n            return Err(PartyError::AgeOutOfRange);\n        }\n        u16::try_from(years).map_err(|_| PartyError::AgeOutOfRange)\n''',
              '''        if (date.month, date.day) < (self.month, self.day) {\n            // `date >= self` means a pre-birthday date here must be in a later year.\n            years -= 1;\n        }\n        if years > i32::from(MAX_AGE) {\n            return Err(PartyError::AgeOutOfRange);\n        }\n        #[expect(\n            clippy::cast_possible_truncation,\n            clippy::cast_sign_loss,\n            reason = "the checks above prove age is in the closed interval 0..=MAX_AGE"\n        )]\n        let age = years as u16;\n        Ok(age)\n''',
          )

          # Rule bytecode: ops length is checked once; pushes cannot exceed the number of ops.
          replace_once(
              'crates/veyra-rule-compiler/src/lib.rs',
              '''        if self.schema_version != RULE_SCHEMA_V1 {\n            return Err(CompileError::UnsupportedSchema(self.schema_version));\n        }\n        let mut stack = [false; MAX_OPS];\n''',
              '''        if self.schema_version != RULE_SCHEMA_V1 {\n            return Err(CompileError::UnsupportedSchema(self.schema_version));\n        }\n        if self.ops.len() > MAX_OPS {\n            return Err(CompileError::TooManyOps(self.ops.len()));\n        }\n        let mut stack = [false; MAX_OPS];\n''',
          )
          p = Path('crates/veyra-rule-compiler/src/lib.rs')
          text = p.read_text()
          text = text.replace('                    )?;\n', '                    );\n')
          text = text.replace('                    push(&mut stack, &mut stack_len, valid)?;\n', '                    push(&mut stack, &mut stack_len, valid);\n')
          text = text.replace('                    push(&mut stack, &mut stack_len, !value)?;\n', '                    push(&mut stack, &mut stack_len, !value);\n')
          old = '''fn push(\n    stack: &mut [bool; MAX_OPS],\n    stack_len: &mut usize,\n    value: bool,\n) -> Result<(), CompileError> {\n    if *stack_len == MAX_OPS {\n        return Err(CompileError::RuntimeInvariant);\n    }\n    stack[*stack_len] = value;\n    *stack_len += 1;\n    Ok(())\n}\n'''
          new = '''fn push(stack: &mut [bool; MAX_OPS], stack_len: &mut usize, value: bool) {\n    stack[*stack_len] = value;\n    *stack_len += 1;\n}\n'''
          if text.count(old) != 1:
              raise SystemExit('rule compiler: push helper mismatch')
          text = text.replace(old, new)
          old = '''    let mut value = matches!(reduction, Reduction::And);\n    for _ in 0..count {\n        let next = pop(stack, stack_len)?;\n        value = match reduction {\n            Reduction::And => value && next,\n            Reduction::Or => value || next,\n        };\n    }\n    push(stack, stack_len, value)\n}\n'''
          new = '''    let mut value = matches!(reduction, Reduction::And);\n    for _ in 0..count {\n        *stack_len -= 1;\n        let next = stack[*stack_len];\n        value = match reduction {\n            Reduction::And => value && next,\n            Reduction::Or => value || next,\n        };\n    }\n    push(stack, stack_len, value);\n    Ok(())\n}\n'''
          if text.count(old) != 1:
              raise SystemExit('rule compiler: reduce helper mismatch')
          p.write_text(text.replace(old, new))

          # Segment encoding cannot fail. Use one concrete Path API to avoid duplicate monomorphized IO paths.
          replace_once(
              'crates/veyra-segment/src/lib.rs',
              '    pub fn encode(&self) -> Result<Vec<u8>, SegmentError> {\n',
              '    pub fn encode(&self) -> Vec<u8> {\n',
          )
          replace_once(
              'crates/veyra-segment/src/lib.rs',
              '''        out.extend_from_slice(&self.payload);\n        Ok(out)\n    }\n''',
              '''        out.extend_from_slice(&self.payload);\n        out\n    }\n''',
          )
          replace_once(
              'crates/veyra-segment/src/lib.rs',
              '''    pub fn write_atomic(&self, path: impl AsRef<Path>) -> Result<(), SegmentError> {\n        let path = path.as_ref();\n        let temp = temp_path(path)?;\n        let encoded = self.encode()?;\n''',
              '''    pub fn write_atomic(&self, path: &Path) -> Result<(), SegmentError> {\n        let temp = temp_path(path)?;\n        let encoded = self.encode();\n''',
          )
          replace_once(
              'crates/veyra-segment/src/lib.rs',
              '    pub fn read(path: impl AsRef<Path>) -> Result<Self, SegmentError> {\n',
              '    pub fn read(path: &Path) -> Result<Self, SegmentError> {\n',
          )
          for path in [
              Path('crates/veyra-segment/src/lib.rs'),
              Path('crates/veyra-segment/tests/coverage.rs'),
          ]:
              text = path.read_text()
              text = text.replace('.encode().unwrap_or_else(|_| unreachable!())', '.encode()')
              text = text.replace('.encode()\n        .unwrap_or_else(|_| unreachable!())', '.encode()')
              path.write_text(text)
          PY

      - name: Verify full stable workspace
        id: verify
        shell: bash
        run: |
          set +e
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
          setup=$?
          if [ "$setup" -eq 0 ]; then cargo fmt --all; fmt=$?; else fmt=1; fi
          if [ "$fmt" -eq 0 ]; then cargo clippy --workspace --all-targets --all-features --locked -- -D warnings; clippy=$?; else clippy=1; fi
          if [ "$clippy" -eq 0 ]; then cargo test --workspace --all-features --locked; tests=$?; else tests=1; fi
          if [ "$setup" -eq 0 ] && [ "$fmt" -eq 0 ] && [ "$clippy" -eq 0 ] && [ "$tests" -eq 0 ]; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Commit verified structural pass
        if: steps.verify.outputs.passed == 'true'
        run: |
          git rm .github/workflows/structural-coverage-pass.yml
          git config user.name "eukalpia"
          git config user.email "120781817+eukalpia@users.noreply.github.com"
          git add .
          git commit -m "refactor: simplify proven production invariants"
          git push origin HEAD:agent/m0-foundation-ci

      - name: Remove failed helper without candidate changes
        if: steps.verify.outputs.passed != 'true'
        run: |
          git reset --hard HEAD
          git clean -fd
          git rm .github/workflows/structural-coverage-pass.yml
          git config user.name "eukalpia"
          git config user.email "120781817+eukalpia@users.noreply.github.com"
          git commit -m "ci: remove failed structural coverage helper"
          git push origin HEAD:agent/m0-foundation-ci
          exit 1
