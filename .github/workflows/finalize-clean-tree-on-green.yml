name: Finalize clean tree on green

on:
  workflow_run:
    workflows:
      - Current production qualification
    types:
      - completed

permissions:
  contents: write
  pull-requests: write

env:
  TARGET_BRANCH: agent/v1-production-completion

jobs:
  clean:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'agent/v1-production-completion'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
      - name: Require qualification of the current branch head
        env:
          QUALIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          CURRENT_SHA=$(git rev-parse HEAD)
          test "$CURRENT_SHA" = "$QUALIFIED_SHA"
      - name: Remove one-shot diagnostics and stale locators
        shell: bash
        run: |
          rm -f .github/workflows/repair-semantic-baseline.yml
          rm -rf docs/ci/current-baseline
          rm -rf docs/ci/current-coverage
          rm -f docs/.source-snapshot-run
      - name: Publish clean-tree commit only when required
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Qualified tree is already clean"
            exit 0
          fi
          git commit -m "ci: remove one-shot qualification diagnostics"
          git push origin HEAD:${TARGET_BRANCH}
