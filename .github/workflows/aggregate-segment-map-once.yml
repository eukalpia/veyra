name: Aggregate segment map once

on:
  push:
    branches:
      - agent/v1-coverage-segment-map
    paths:
      - .github/workflows/aggregate-segment-map-once.yml

permissions:
  contents: write

jobs:
  map:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/v1-coverage-segment-map
          fetch-depth: 0
      - name: Install coverage toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt
          rustup toolchain install nightly --profile minimal --component llvm-tools-preview
          cargo install cargo-llvm-cov --locked
      - name: Materialize V4 candidate
        shell: bash
        run: |
          python3 tools/final-hardening/apply.py transform
          python3 tools/final-hardening/apply.py tests
          cat tools/final-hardening/regions_v3.py.gz.b64.part{1,2,3,4} | base64 -d | gzip -d > /tmp/r3.py
          python3 /tmp/r3.py
          python3 tools/final-hardening/regions_v4.py
          python3 - <<'PY'
          from pathlib import Path
          matrix=Path('crates/veyra-query/tests/multi_room_matrix.rs'); t=matrix.read_text(); t=t.replace("fn query<'a>(party: &'a BookingParty, profile: SolutionProfile) -> MultiRoomStayQuery<'a> {\n","fn query(party: &BookingParty, profile: SolutionProfile) -> MultiRoomStayQuery<'_> {\n"); matrix.write_text(t)
          server=Path('crates/veyra-server/tests/query_success_matrix.rs'); t=server.read_text().replace('.unwrap_err();','.err().unwrap_or_else(|| unreachable!());',1); server.write_text(t)
          solver=Path('crates/veyra-solver/src/lib.rs'); t=solver.read_text()
          for old,new in [("fn prepared<'a>(","fn prepared("),("policy: &'a CompiledRule,","policy: &CompiledRule,"),(") -> PreparedOffer<'a> {",") -> PreparedOffer<'_> {"),("fn static_offer<'a>(id: u32, rule: &'a CompiledRule, price: i64) -> PreparedOffer<'a> {","fn static_offer(id: u32, rule: &CompiledRule, price: i64) -> PreparedOffer<'_> {")]: t=t.replace(old,new,1)
          solver.write_text(t)
          checkpoint=Path('crates/veyra-cdc/src/checkpoint.rs'); t=checkpoint.read_text(); t=t.replace('        assert_eq!(\n            validate_transition(AppliedState::default(), state(10, 11, 1)),\n            Ok(())\n        );','        assert!(validate_transition(AppliedState::default(), state(10, 11, 1)).is_ok());',1); t=t.replace('        assert_eq!(validate_transition(current, current), Ok(()));','        assert!(validate_transition(current, current).is_ok());',1); checkpoint.write_text(t)
          PY
          cargo generate-lockfile
          cargo fmt --all
      - name: Export aggregate zero-count merged segments
        shell: bash
        run: |
          d=$(mktemp -d); rsync -a --exclude .git ./ "$d/"; cd "$d"
          python3 - <<'PY'
          from pathlib import Path
          import re
          for root in Path('crates').glob('*/src/lib.rs'):
              t=root.read_text(); m='#![feature(coverage_attribute)]\n'
              if not t.startswith(m): root.write_text(m+t)
          for p in Path('crates').glob('*/src/*.rs'):
              t=p.read_text(); t=re.sub(r'(#\[cfg\(test\)\]\n)(?!#\[coverage\(off\)\]\n)',r'\1#[coverage(off)]\n',t); t=t.replace('// coverage: external-postgres-transport\n','#[coverage(off)]\n'); p.write_text(t)
          PY
          cargo +nightly llvm-cov --workspace --all-features --lib --tests --locked --ignore-filename-regex 'crates/veyra-server/src/main.rs' --summary-only >/dev/null
          cargo +nightly llvm-cov report --ignore-filename-regex 'crates/veyra-server/src/main.rs' --json --output-path /tmp/agg.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('/tmp/agg.json').read_text())['data'][0]
          rows=[]
          out=['AGGREGATED FILE-LEVEL ZERO-COUNT REGION-ENTRY SEGMENTS','']
          for f in data['files']:
              r=f['summary']['regions']; missed=r['count']-r['covered']
              if not missed: continue
              name=f['filename']
              if '/crates/' in name: name='crates/'+name.split('/crates/',1)[1]
              elif not name.startswith('crates/'): continue
              src=Path(name).read_text().splitlines()
              zero=[]
              for s in f.get('segments',[]):
                  if len(s)>=6:
                      line,col,count,has_count,is_entry,is_gap=s[:6]
                      if has_count and is_entry and not is_gap and count==0:
                          zero.append((line,col))
              out.append(f'{name}: summary_missed_regions={missed}, zero_merged_entries={len(zero)}')
              for line,col in zero:
                  snippet=src[line-1].strip() if 0<line<=len(src) else ''
                  out.append(f'  {line}:{col} | {snippet}')
              out.append('')
          Path('/tmp/aggregate-segments.txt').write_text('\n'.join(out)+'\n')
          PY
      - name: Publish diagnostic only
        shell: bash
        run: |
          git reset --hard HEAD
          mkdir -p docs/ci-checkpoints
          cp /tmp/aggregate-segments.txt docs/ci-checkpoints/aggregate-segments.txt
          git rm .github/workflows/aggregate-segment-map-once.yml
          git add docs/ci-checkpoints/aggregate-segments.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ci: record aggregate missed coverage segments"
          git push origin HEAD:agent/v1-coverage-segment-map
