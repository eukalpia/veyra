name: Server boundary coverage once

on:
  push:
    branches:
      - agent/v1-production-completion
    paths:
      - .github/workflows/server-boundary-coverage-once.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/v1-production-completion
          fetch-depth: 0
      - run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - name: Add server boundary test dependencies and exact success-path tests
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          cargo = Path('crates/veyra-server/Cargo.toml')
          text = cargo.read_text()
          additions = '''
veyra-availability = { version = "0.1.0", path = "../veyra-availability" }
veyra-pricing = { version = "0.1.0", path = "../veyra-pricing" }
veyra-ranking = { version = "0.1.0", path = "../veyra-ranking" }
veyra-restrictions = { version = "0.1.0", path = "../veyra-restrictions" }
veyra-rule-compiler = { version = "0.1.0", path = "../veyra-rule-compiler" }
veyra-rules = { version = "0.1.0", path = "../veyra-rules" }
'''
          marker = '[dev-dependencies]\n'
          if 'veyra-availability = ' not in text:
              if marker not in text:
                  raise SystemExit('server dev-dependencies marker missing')
              text = text.replace(marker, marker + additions, 1)
              cargo.write_text(text)
          PY
          cat > crates/veyra-server/tests/query_success_matrix.rs <<'RS'
          use std::sync::Arc;

          use veyra_availability::AvailabilityIndex;
          use veyra_party::{AgeEvidence, BookingParty, CivilDate, Traveler, TravelerId};
          use veyra_pricing::{MoneyMicros, OccupancyAdjustment, PriceVector};
          use veyra_query::{
              MultiRoomStayQuery, QueryError, RoomDocument, SearchEngine, SolutionProfile,
              SolverConfig, StayQuery,
          };
          use veyra_ranking::{RankingKind, RankingProfile};
          use veyra_restrictions::{
              RESTRICTION_SCHEMA_V1, RestrictionRule, compile as compile_restrictions,
          };
          use veyra_rule_compiler::{RULE_SCHEMA_V1, compile as compile_rule};
          use veyra_rules::Rule;
          use veyra_runtime::{GenerationState, PublishedGeneration, RuntimeSnapshot};
          use veyra_server::{QueryService, ServiceQueryError};
          use veyra_types::{GenerationId, LogSequenceNumber, ProjectionProgress};

          fn date() -> CivilDate {
              CivilDate::new(2026, 9, 21).unwrap_or_else(|_| unreachable!())
          }

          fn money(value: i64) -> MoneyMicros {
              MoneyMicros::try_nonnegative(value).unwrap_or_else(|_| unreachable!())
          }

          fn party() -> BookingParty {
              let mut builder = BookingParty::builder();
              builder
                  .add_traveler(Traveler::new(
                      TravelerId::new(1),
                      AgeEvidence::AgeAtCheckIn(30),
                      false,
                  ))
                  .unwrap_or_else(|_| unreachable!());
              builder.build().unwrap_or_else(|_| unreachable!())
          }

          fn engine() -> SearchEngine {
              let mut availability =
                  AvailabilityIndex::new(10, 2, 1).unwrap_or_else(|_| unreachable!());
              for day in 10..12 {
                  availability
                      .set_available(day, 0, true)
                      .unwrap_or_else(|_| unreachable!());
              }
              SearchEngine::try_new(
                  availability,
                  vec![RoomDocument {
                      room_id: 0,
                      property_id: 7,
                      destination_id: 55,
                      adult_age: 18,
                      occupancy_rule: compile_rule(
                          RULE_SCHEMA_V1,
                          &Rule::Capacity { min: 1, max: 2 },
                      )
                      .unwrap_or_else(|_| unreachable!()),
                      restrictions: compile_restrictions(
                          RESTRICTION_SCHEMA_V1,
                          &[RestrictionRule::MinStay(1), RestrictionRule::MaxStay(2)],
                      )
                      .unwrap_or_else(|_| unreachable!()),
                      prices: PriceVector::try_new(10, vec![money(100), money(100)], 1)
                          .unwrap_or_else(|_| unreachable!()),
                      occupancy_adjustment: OccupancyAdjustment {
                          per_adult_per_night: MoneyMicros::signed(0),
                          per_child_per_night: MoneyMicros::signed(0),
                      },
                      distance_meters: 100,
                      quality_milli: 900,
                      flexibility_milli: 900,
                      family_penalty: 0,
                  }],
              )
              .unwrap_or_else(|_| unreachable!())
          }

          fn service() -> QueryService {
              let status = RuntimeSnapshot::ready(
                  GenerationId::new(9),
                  ProjectionProgress::at(LogSequenceNumber::new(55)),
              );
              let publication = PublishedGeneration::try_with_payload(status, Arc::new(engine()))
                  .unwrap_or_else(|_| unreachable!());
              QueryService::new(GenerationState::new(publication))
          }

          #[test]
          fn query_service_executes_single_and_multi_room_success_paths() {
              let party = party();
              let single = service()
                  .search(
                      LogSequenceNumber::new(55),
                      &StayQuery {
                          destination_id: 55,
                          check_in_day: 10,
                          check_out_day: 11,
                          check_in_date: date(),
                          party: &party,
                          budget: None,
                          ranking: RankingProfile::v1(RankingKind::Cheapest),
                          limit: 10,
                      },
                  )
                  .unwrap_or_else(|_| unreachable!());
              assert_eq!(single.hits.len(), 1);

              let multi = service()
                  .search_multi_room(
                      LogSequenceNumber::new(55),
                      &MultiRoomStayQuery {
                          destination_id: 55,
                          check_in_day: 10,
                          check_out_day: 11,
                          check_in_date: date(),
                          party: &party,
                          budget: None,
                          profile: SolutionProfile::Cheapest,
                          solver: SolverConfig::default(),
                          limit: 10,
                      },
                  )
                  .unwrap_or_else(|_| unreachable!());
              assert_eq!(multi.hits.len(), 1);
          }

          #[test]
          fn admitted_query_rejections_keep_stable_machine_and_display_surfaces() {
              let party = party();
              let error = service()
                  .search(
                      LogSequenceNumber::new(55),
                      &StayQuery {
                          destination_id: 55,
                          check_in_day: 10,
                          check_out_day: 11,
                          check_in_date: date(),
                          party: &party,
                          budget: None,
                          ranking: RankingProfile::v1(RankingKind::Cheapest),
                          limit: 0,
                      },
                  )
                  .unwrap_err();
              assert_eq!(error.code(), "query_rejected");
              assert!(error.to_string().contains("query_rejected"));
              assert_eq!(error, ServiceQueryError::Query(QueryError::InvalidLimit(0)));

              let semantic = ServiceQueryError::Query(QueryError::MissingRoomTopology(
                  veyra_party::RoomingRelation::ConnectedRooms,
              ));
              assert_eq!(semantic.code(), "unsupported_semantics");
              assert!(semantic.to_string().contains("unsupported_semantics"));
          }
          RS
      - name: Regenerate lockfile and verify server boundary
        run: |
          cargo generate-lockfile
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy -p veyra-server --all-targets --all-features --locked -- -D warnings
          cargo test -p veyra-server --all-features --locked
          cargo metadata --locked --format-version 1 > /dev/null
      - name: Publish verified source only
        shell: bash
        run: |
          git rm .github/workflows/server-boundary-coverage-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock crates/veyra-server
          git diff --cached --check
          git commit -m "test: prove server query success boundaries"
          git push origin HEAD:agent/v1-production-completion
