name: Rustfmt new coverage tests once

on:
  push:
    branches:
      - agent/v1-production-completion
    paths:
      - .github/workflows/rustfmt-new-coverage-tests-once.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rustfmt-new-coverage-tests-once
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/v1-production-completion
          fetch-depth: 0
      - name: Install pinned rustfmt
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt
      - name: Format and verify
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
      - name: Publish formatting only
        shell: bash
        run: |
          git rm .github/workflows/rustfmt-new-coverage-tests-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "style: normalize coverage regression tests"
          git push origin HEAD:agent/v1-production-completion
