name: Add query deep coverage tests

on:
  push:
    branches:
      - agent/v1-production-completion
    paths:
      - .github/workflows/add-query-deep-coverage-tests.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: add-query-deep-coverage-tests
  cancel-in-progress: false

jobs:
  add-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/v1-production-completion
          fetch-depth: 0
      - name: Install pinned Rust
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - name: Add deep query matrix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/veyra-query/tests/multi_room.rs")
          text = path.read_text()
          marker = "multi_room_deep_coverage_matrix"
          if marker in text:
              raise SystemExit(0)
          if not text.startswith("#![allow("):
              text = "#![allow(clippy::too_many_lines, clippy::similar_names)]\n\n" + text
          addition = r'''

#[test]
fn multi_room_deep_coverage_matrix() {
    let count_mismatch = AvailabilityIndex::new(10, 5, 1).unwrap_or_else(|_| unreachable!());
    assert!(SearchEngine::try_new(count_mismatch, Vec::new()).is_err());

    let dense = AvailabilityIndex::new(10, 5, 1).unwrap_or_else(|_| unreachable!());
    let mut wrong_id = room(9, 100, 0);
    wrong_id.property_id = 1;
    assert!(SearchEngine::try_new(dense, vec![wrong_id]).is_err());

    let adult_age = AvailabilityIndex::new(10, 5, 1).unwrap_or_else(|_| unreachable!());
    let mut invalid_age = room(0, 100, 0);
    invalid_age.adult_age = 0;
    assert!(SearchEngine::try_new(adult_age, vec![invalid_age]).is_err());

    let mut availability = AvailabilityIndex::new(10, 10, 2).unwrap_or_else(|_| unreachable!());
    for room_id in 0..2 {
        for day in 10..20 {
            availability
                .set_available(day, room_id, true)
                .unwrap_or_else(|_| unreachable!());
        }
    }
    let mut restricted_a = room(0, 100, 0);
    restricted_a.prices = PriceVector::try_new(10, vec![money(100); 10], 1)
        .unwrap_or_else(|_| unreachable!());
    let mut restricted_b = room(1, 100, 0);
    restricted_b.prices = PriceVector::try_new(10, vec![money(100); 10], 1)
        .unwrap_or_else(|_| unreachable!());
    let restricted = SearchEngine::try_new(availability, vec![restricted_a, restricted_b])
        .unwrap_or_else(|_| unreachable!());
    let party = party();
    let mut query = multi_query(&party);
    query.check_out_day = 16;
    let result = restricted
        .search_multi_room(&query)
        .unwrap_or_else(|_| unreachable!());
    assert!(result.hits.is_empty());
    assert_eq!(result.explain.properties_solved, 0);

    let mut availability = AvailabilityIndex::new(10, 5, 2).unwrap_or_else(|_| unreachable!());
    for room_id in 0..2 {
        for day in 10..15 {
            availability
                .set_available(day, room_id, true)
                .unwrap_or_else(|_| unreachable!());
        }
    }
    let mut missing_a = room(0, 100, 0);
    missing_a.prices = PriceVector::try_new(20, vec![money(100); 5], 1)
        .unwrap_or_else(|_| unreachable!());
    let mut missing_b = room(1, 100, 0);
    missing_b.prices = PriceVector::try_new(20, vec![money(100); 5], 1)
        .unwrap_or_else(|_| unreachable!());
    let missing = SearchEngine::try_new(availability, vec![missing_a, missing_b])
        .unwrap_or_else(|_| unreachable!());
    assert!(missing.search_multi_room(&multi_query(&party)).is_err());

    for profile in [
        SolutionProfile::FewestRooms,
        SolutionProfile::BestFamilyLayout,
    ] {
        let mut query = multi_query(&party);
        query.profile = profile;
        let result = engine()
            .search_multi_room(&query)
            .unwrap_or_else(|_| unreachable!());
        assert_eq!(result.hits.len(), 1);
        assert_eq!(result.hits[0].property_id, 7);
    }

    let mut query = multi_query(&party);
    query.solver = SolverConfig {
        max_states: 50_000,
        max_solutions: 1,
    };
    assert!(engine().search_multi_room(&query).is_err());
}
'''
          path.write_text(text.rstrip() + addition + "\n")
          PY
      - name: Format and verify query
        run: |
          cargo fmt --all
          cargo test -p veyra-query --all-features --locked
          cargo clippy -p veyra-query --all-targets --all-features --locked -- -D warnings
      - name: Commit tests
        shell: bash
        run: |
          git rm .github/workflows/add-query-deep-coverage-tests.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/veyra-query/tests/multi_room.rs .github/workflows/add-query-deep-coverage-tests.yml
          git commit -m "test: deepen multi-room query qualification matrix"
          git fetch origin agent/v1-production-completion
          git rebase origin/agent/v1-production-completion
          git push origin HEAD:agent/v1-production-completion
