name: V1 source snapshot

on:
  push:
    branches:
      - agent/v1-production-completion
    paths:
      - .github/workflows/v1-source-snapshot.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/v1-production-completion
      - name: Create exact source archive
        run: git archive --format=zip --output=veyra-v1-source.zip HEAD
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: veyra-v1-source-${{ github.sha }}
          path: veyra-v1-source.zip
          if-no-files-found: error
