name: Source snapshot

on:
  push:
    branches:
      - agent/m0-foundation-ci
      - agent/v1-production-completion
    paths-ignore:
      - docs/.source-snapshot-run

permissions:
  contents: write

concurrency:
  group: source-snapshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  archive:
    name: Archive exact branch source
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
      - name: Create reproducible source archive
        run: git archive --format=zip --output=veyra-source.zip HEAD
      - name: Upload exact source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: veyra-source-${{ github.sha }}
          path: veyra-source.zip
          if-no-files-found: error
      - name: Publish V1 snapshot run locator
        if: github.ref_name == 'agent/v1-production-completion'
        shell: bash
        run: |
          printf '%s\n%s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > docs/.source-snapshot-run
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/.source-snapshot-run
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "ci: record source snapshot run"
          git push origin HEAD:agent/v1-production-completion
