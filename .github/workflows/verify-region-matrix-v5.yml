name: Verify region matrix v5

on:
  push:
    branches:
      - agent/m0-foundation-ci
    paths:
      - .github/workflows/verify-region-matrix-v5.yml

permissions:
  contents: write

concurrency:
  group: verify-region-matrix-v5
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/m0-foundation-ci
          fetch-depth: 0
      - name: Fix external API import, make tests fallible, format and verify
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          cdc = Path('crates/veyra-cdc/tests/recovery_region_matrix.rs')
          text = cdc.read_text()
          old = 'use pgwire_replication::protocol::{Lsn, ReplicationEvent};\n'
          new = 'use pgwire_replication::{Lsn, ReplicationEvent};\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected one pgwire import, found {text.count(old)}')
          cdc.write_text(text.replace(old, new))

          segment = Path('crates/veyra-segment/tests/error_surface_matrix.rs')
          text = segment.read_text()
          replacements = (
              (
                  'fn missing_file_name_and_missing_file_fail_through_typed_boundaries() {\n',
                  'fn missing_file_name_and_missing_file_fail_through_typed_boundaries() -> Result<(), Box<dyn Error>> {\n',
              ),
              (
                  '    let error = Segment::read(&missing).expect_err("missing file must fail closed");\n',
                  '    let Err(error) = Segment::read(&missing) else {\n        return Err("missing file unexpectedly decoded".into());\n    };\n',
              ),
              (
                  '    assert!(error.source().is_some());\n}\n\n#[test]\nfn every_semantic_error_variant_has_a_stable_non_io_surface()',
                  '    assert!(error.source().is_some());\n    Ok(())\n}\n\n#[test]\nfn every_semantic_error_variant_has_a_stable_non_io_surface()',
              ),
          )
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'expected exactly one segment match for {old!r}, found {text.count(old)}')
              text = text.replace(old, new)
          segment.write_text(text)
          PY
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
          cargo fmt --all
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-features --locked
      - name: Commit verified matrix and remove all temporary helpers
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/verify-region-matrix-v5.yml
          git rm .github/workflows/verify-region-matrix-v4.yml
          git rm .github/workflows/verify-region-matrix-v3.yml
          git rm .github/workflows/verify-region-matrix-v2.yml
          git rm .github/workflows/format-region-matrix.yml
          git add crates/veyra-cdc/tests/recovery_region_matrix.rs \
                  crates/veyra-pricing/tests/region_matrix.rs \
                  crates/veyra-restrictions/tests/region_matrix.rs \
                  crates/veyra-segment/tests/error_surface_matrix.rs
          git config user.name "Veyra CI"
          git config user.email "120781817+eukalpia@users.noreply.github.com"
          git commit -m "test: verify production branch region matrix"
          git push origin HEAD:agent/m0-foundation-ci
