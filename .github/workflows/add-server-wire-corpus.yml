name: Add server wire corpus

on:
  push:
    branches:
      - agent/v1-production-completion
    paths:
      - .github/workflows/add-server-wire-corpus.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: add-server-wire-corpus
  cancel-in-progress: false

jobs:
  add-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/v1-production-completion
          fetch-depth: 0
      - name: Install pinned Rust
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - name: Derive route fixture and add malformed wire corpus
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("crates/veyra-server/tests/query_boundary.rs")
          text = path.read_text()
          marker = "http_malformed_wire_corpus_is_always_client_error"
          if marker in text:
              raise SystemExit(0)

          helper_matches = re.findall(r"let\s+\w+\s*=\s*([A-Za-z_][A-Za-z0-9_]*)\(\)\s*(\.await)?\s*;", text)
          if not helper_matches:
              raise RuntimeError("zero-argument app fixture not found")
          helper, await_suffix = helper_matches[0]
          helper_call = f"{helper}()" + (".await" if await_suffix else "")

          paths = re.findall(r"\.uri\(\s*\"([^\"]+)\"\s*\)", text)
          query_paths = [candidate for candidate in paths if "query" in candidate or "search" in candidate]
          if not query_paths:
              raise RuntimeError(f"query path not found: {paths}")
          query_path = query_paths[0]

          addition = f'''

use axum::body::Body as WireBody;
use axum::http::{{Method as WireMethod, Request as WireRequest}};
use tower::ServiceExt as WireServiceExt;

#[tokio::test]
async fn http_malformed_wire_corpus_is_always_client_error() {{
    let app = {helper_call};
    let corpus: Vec<(&'static str, Vec<u8>, Option<&'static str>)> = vec![
        ("empty", Vec::new(), Some("application/json")),
        ("null", b"null".to_vec(), Some("application/json")),
        ("array", b"[]".to_vec(), Some("application/json")),
        ("empty-object", b"{{}}".to_vec(), Some("application/json")),
        ("truncated", b"{{".to_vec(), Some("application/json")),
        ("trailing", b"{{}} trailing".to_vec(), Some("application/json")),
        ("binary", vec![0xff, 0xfe, 0xfd], Some("application/json")),
        ("wrong-content-type", b"{{}}".to_vec(), Some("text/plain")),
        ("missing-content-type", b"{{}}".to_vec(), None),
        ("large-invalid", vec![b'x'; 256 * 1024], Some("application/json")),
    ];

    for (case_name, body, content_type) in corpus {{
        let mut builder = WireRequest::builder()
            .method(WireMethod::POST)
            .uri("{query_path}");
        if let Some(content_type) = content_type {{
            builder = builder.header("content-type", content_type);
        }}
        let request = builder
            .body(WireBody::from(body))
            .unwrap_or_else(|_| unreachable!());
        let response = app
            .clone()
            .oneshot(request)
            .await
            .unwrap_or_else(|_| unreachable!());
        assert!(
            response.status().is_client_error(),
            "{{case_name}} unexpectedly returned {{}}",
            response.status()
        );
    }}

    for method in [
        WireMethod::GET,
        WireMethod::PUT,
        WireMethod::PATCH,
        WireMethod::DELETE,
        WireMethod::HEAD,
    ] {{
        let request = WireRequest::builder()
            .method(method)
            .uri("{query_path}")
            .body(WireBody::empty())
            .unwrap_or_else(|_| unreachable!());
        let response = app
            .clone()
            .oneshot(request)
            .await
            .unwrap_or_else(|_| unreachable!());
        assert!(response.status().is_client_error());
    }}
}}
'''
          path.write_text(text.rstrip() + addition + "\n")
          PY
      - name: Format and verify
        run: |
          cargo fmt --all
          cargo test -p veyra-server --all-features --locked
          cargo clippy -p veyra-server --all-targets --all-features --locked -- -D warnings
      - name: Commit corpus and remove workflow
        shell: bash
        run: |
          git rm .github/workflows/add-server-wire-corpus.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/veyra-server/tests/query_boundary.rs .github/workflows/add-server-wire-corpus.yml
          git commit -m "test: add malformed HTTP wire corpus"
          git fetch origin agent/v1-production-completion
          git rebase origin/agent/v1-production-completion
          git push origin HEAD:agent/v1-production-completion
