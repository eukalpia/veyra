name: Repair serde invariant lockfile

on:
  push:
    branches:
      - agent/v1-production-completion
    paths:
      - .github/workflows/repair-serde-invariant-lockfile.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-serde-invariant-lockfile
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/v1-production-completion
          fetch-depth: 0
      - name: Install pinned Rust
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Synchronize dependency graph
        run: cargo generate-lockfile
      - name: Verify workspace lockfile
        run: cargo metadata --locked --format-version 1 > /dev/null
      - name: Verify fuzz lockfile
        working-directory: fuzz
        run: cargo metadata --locked --format-version 1 > /dev/null
      - name: Commit synchronized lockfile and remove one-shot workflow
        shell: bash
        run: |
          git rm .github/workflows/repair-serde-invariant-lockfile.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "build: synchronize serde invariant test dependencies"
          git push origin HEAD:agent/v1-production-completion
