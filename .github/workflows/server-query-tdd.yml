name: Server query TDD gate

on:
  push:
    branches:
      - agent/v1-production-completion
    paths:
      - .github/workflows/server-query-tdd.yml
      - tools/staged/apply_server_query_boundary.py
      - tools/staged/fix_server_query_match.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/v1-production-completion
      - name: Install pinned Rust
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - name: Install typed query boundary
        run: |
          python3 tools/staged/apply_server_query_boundary.py
          python3 tools/staged/fix_server_query_match.py
      - name: Synchronize workspace lockfile
        run: cargo generate-lockfile
      - name: Format workspace
        run: cargo fmt --all
      - name: Strict server clippy
        run: cargo clippy -p veyra-server --all-targets --all-features --locked -- -D warnings
      - name: Server tests
        run: cargo test -p veyra-server --all-features --locked
      - name: Commit verified typed query boundary
        shell: bash
        run: |
          git rm tools/staged/apply_server_query_boundary.py tools/staged/fix_server_query_match.py .github/workflows/server-query-tdd.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock crates/veyra-server/Cargo.toml crates/veyra-server/src/lib.rs
          git commit -m "feat: gate typed queries on atomic runtime generations"
          git push origin HEAD:agent/v1-production-completion
