name: Locate fix-hardening run

on:
  push:
    branches:
      - agent/v1-production-completion
    paths:
      - .github/workflows/locate-fix-hardening-run.yml

permissions:
  actions: read
  contents: write

jobs:
  locate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/v1-production-completion
      - name: Record latest fix run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/fix-hardening-clippy.yml/runs?branch=agent%2Fv1-production-completion&per_page=1" \
            --jq '.workflow_runs[0] | [.id, .status, (.conclusion // "pending"), .head_sha] | @tsv' \
            > docs/.fix-hardening-run
      - name: Commit locator
        shell: bash
        run: |
          git rm .github/workflows/locate-fix-hardening-run.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/.fix-hardening-run
          git commit -m "ci: record fix-hardening run"
          git push origin HEAD:agent/v1-production-completion
