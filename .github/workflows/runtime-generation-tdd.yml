name: Runtime generation TDD gate

on:
  push:
    branches:
      - agent/v1-production-completion
    paths:
      - .github/workflows/runtime-generation-tdd.yml
      - tools/staged/apply_runtime_generation.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/v1-production-completion
      - name: Install pinned Rust
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - name: Install atomic generation implementation
        run: python3 tools/staged/apply_runtime_generation.py
      - name: Format workspace
        run: cargo fmt --all
      - name: Strict runtime clippy
        run: cargo clippy -p veyra-runtime --all-targets --all-features --locked -- -D warnings
      - name: Runtime tests
        run: cargo test -p veyra-runtime --all-features --locked
      - name: Commit verified atomic generation implementation
        shell: bash
        run: |
          git rm tools/staged/apply_runtime_generation.py .github/workflows/runtime-generation-tdd.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/veyra-runtime/src/lib.rs
          git commit -m "feat: publish runtime status and generation atomically"
          git push origin HEAD:agent/v1-production-completion
