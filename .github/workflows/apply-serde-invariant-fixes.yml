name: Apply serde invariant fixes

on:
  push:
    branches:
      - agent/v1-production-completion
    paths:
      - .github/workflows/apply-serde-invariant-fixes.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-serde-invariant-fixes
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/v1-production-completion
          fetch-depth: 0
      - name: Install pinned Rust
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - name: Synchronize lockfile
        run: cargo generate-lockfile
      - name: Apply validated deserialization boundaries
        shell: bash
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import re
          from pathlib import Path

          ROOT = Path("crates")

          def locate(symbol: str) -> Path:
              matches = []
              needle = f"pub struct {symbol}"
              for path in ROOT.rglob("*.rs"):
                  if needle in path.read_text():
                      matches.append(path)
              if len(matches) != 1:
                  raise SystemExit(f"expected one {symbol}, found {matches}")
              return matches[0]

          def matching_brace(text: str, opening: int) -> int:
              depth = 0
              for index in range(opening, len(text)):
                  char = text[index]
                  if char == "{":
                      depth += 1
                  elif char == "}":
                      depth -= 1
                      if depth == 0:
                          return index
              raise SystemExit("unbalanced Rust braces")

          def struct_bounds(text: str, symbol: str):
              marker = f"pub struct {symbol}"
              start = text.index(marker)
              opening = text.index("{", start)
              closing = matching_brace(text, opening)
              return start, opening, closing

          def attribute_start(text: str, struct_start: int) -> int:
              line_start = text.rfind("\n", 0, struct_start) + 1
              cursor = line_start
              while cursor > 0:
                  previous_end = cursor - 1
                  previous_start = text.rfind("\n", 0, previous_end) + 1
                  line = text[previous_start:previous_end].strip()
                  if line.startswith("#[") or line.startswith("///") or line.startswith("//!"):
                      cursor = previous_start
                  else:
                      break
              return cursor

          def fields_from(block: str):
              fields = []
              depth = 0
              current = []
              for char in block:
                  if char in "<([{":
                      depth += 1
                  elif char in ">)]}":
                      depth -= 1
                  current.append(char)
                  if char == "," and depth == 0:
                      item = "".join(current).strip()
                      current = []
                      match = re.search(r"(?m)^\s*(?:pub(?:\([^)]*\))?\s+)?([A-Za-z_][A-Za-z0-9_]*)\s*:\s*(.+),\s*$", item)
                      if match:
                          fields.append((match.group(1), match.group(2).strip(), item))
              return fields

          def add_try_from(symbol: str, wire: str, validator: str) -> None:
              path = locate(symbol)
              text = path.read_text()
              if f'try_from = "{wire}"' in text:
                  return
              start, opening, closing = struct_bounds(text, symbol)
              attrs = attribute_start(text, start)
              text = text[:start] + f'#[serde(try_from = "{wire}")]\n' + text[start:]
              shift = len(f'#[serde(try_from = "{wire}")]\n')
              opening += shift
              closing += shift
              block = text[opening + 1:closing]
              fields = fields_from(block)
              if not fields:
                  raise SystemExit(f"could not parse fields for {symbol}")
              names = [name for name, _, _ in fields]
              assignments = ",\n            ".join(f"{name}: raw.{name}" for name in names)
              wire_fields = "\n".join(
                  f"    {name}: {type_name}," for name, type_name, _ in fields
              )
              insertion = f'''\n\n#[derive(serde::Deserialize)]
struct {wire} {{
{wire_fields}
}}

impl TryFrom<{wire}> for {symbol} {{
    type Error = &'static str;

    fn try_from(raw: {wire}) -> Result<Self, Self::Error> {{
        {validator}
        Ok(Self {{
            {assignments}
        }})
    }}
}}
'''
              text = text[:closing + 1] + insertion + text[closing + 1:]
              path.write_text(text)

          progress_path = locate("ProjectionProgress")
          progress_text = progress_path.read_text()
          _, progress_open, progress_close = struct_bounds(progress_text, "ProjectionProgress")
          progress_fields = fields_from(progress_text[progress_open + 1:progress_close])
          progress_names = [name for name, _, _ in progress_fields]

          def require_field(fragment: str, names: list[str]) -> str:
              candidates = [name for name in names if fragment in name.lower() and "lsn" in name.lower()]
              if len(candidates) != 1:
                  raise SystemExit(f"expected one {fragment} LSN in {names}, got {candidates}")
              return candidates[0]

          received = require_field("received", progress_names)
          durable = require_field("durable", progress_names)
          applied = require_field("applied", progress_names)
          published = require_field("published", progress_names)
          add_try_from(
              "ProjectionProgress",
              "ProjectionProgressWire",
              f'''if !(raw.{published} <= raw.{applied}
            && raw.{applied} <= raw.{durable}
            && raw.{durable} <= raw.{received})
        {{
            return Err("projection LSNs must satisfy published <= applied <= durable <= received");
        }}''',
          )

          transaction_path = locate("ProjectedTransaction")
          transaction_text = transaction_path.read_text()
          _, transaction_open, transaction_close = struct_bounds(transaction_text, "ProjectedTransaction")
          transaction_fields = fields_from(transaction_text[transaction_open + 1:transaction_close])
          transaction_names = [name for name, _, _ in transaction_fields]
          begin = require_field("begin", transaction_names)
          commit = require_field("commit", transaction_names)
          end = require_field("end", transaction_names)
          add_try_from(
              "ProjectedTransaction",
              "ProjectedTransactionWire",
              f'''if !(raw.{begin} <= raw.{commit} && raw.{commit} <= raw.{end}) {{
            return Err("transaction LSNs must satisfy begin <= commit <= end");
        }}''',
          )

          runtime_path = locate("RuntimeSnapshot")
          runtime_text = runtime_path.read_text()
          _, runtime_open, runtime_close = struct_bounds(runtime_text, "RuntimeSnapshot")
          runtime_fields = fields_from(runtime_text[runtime_open + 1:runtime_close])
          phase_matches = [(name, type_name) for name, type_name, _ in runtime_fields if name == "phase"]
          if len(phase_matches) != 1:
              raise SystemExit(f"could not identify RuntimeSnapshot phase: {runtime_fields}")
          phase_name, phase_type = phase_matches[0]
          function = re.search(r"(?m)^\s*pub(?:\(crate\))?\s+fn\s+can_query\s*\(&self\)\s*->\s*bool\s*\{", runtime_text)
          if function is None:
              raise SystemExit("RuntimeSnapshot::can_query not found")
          opening = runtime_text.index("{", function.start())
          closing = matching_brace(runtime_text, opening)
          body = runtime_text[opening + 1:closing]
          guard = f"\n        if self.{phase_name} != {phase_type}::Ready {{\n            return false;\n        }}\n"
          if guard.strip() not in body:
              runtime_text = runtime_text[:opening + 1] + guard + runtime_text[opening + 1:]
              runtime_path.write_text(runtime_text)
          PY
      - name: Format production changes
        run: cargo fmt --all
      - name: Verify locked graphs
        run: |
          cargo metadata --locked --format-version 1 > /dev/null
          (cd fuzz && cargo metadata --locked --format-version 1 > /dev/null)
      - name: Verify affected crates
        run: |
          cargo clippy -p veyra-types -p veyra-cdc -p veyra-runtime --all-targets --all-features --locked -- -D warnings
          cargo test -p veyra-types -p veyra-cdc -p veyra-runtime --all-features --locked
      - name: Verify staged RED regressions now pass
        shell: bash
        run: |
          mapfile -t patches < <(find tools/patches -maxdepth 1 -type f -name '*red*.patch' -print | sort)
          if [ "${#patches[@]}" -eq 0 ]; then
            echo "No staged RED invariant patches found" >&2
            exit 1
          fi
          git add Cargo.lock crates
          git commit -m "fix: validate serialized runtime and CDC invariants"
          for patch in "${patches[@]}"; do
            git apply --check "$patch"
            git apply "$patch"
          done
          cargo fmt --all
          cargo test -p veyra-types -p veyra-cdc -p veyra-runtime --all-features --locked
          git reset --hard HEAD
      - name: Remove one-shot workflow and push verified fix
        shell: bash
        run: |
          git rm .github/workflows/apply-serde-invariant-fixes.yml
          git commit --amend --no-edit
          git push origin HEAD:agent/v1-production-completion
