name: Coverage and portability hardening

on:
  push:
    branches:
      - agent/v1-production-completion
    paths:
      - .github/workflows/coverage-portability-hardening.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coverage-portability-hardening
  cancel-in-progress: false

jobs:
  harden-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/v1-production-completion
          fetch-depth: 0

      - name: Install pinned stable and nightly coverage toolchains
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
          rustup toolchain install nightly --profile minimal --component llvm-tools-preview
          cargo install cargo-llvm-cov --locked

      - name: Fix deterministic temporary paths and simplify comparator coverage surface
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text()
              if new in text:
                  return
              if text.count(old) != 1:
                  raise SystemExit(f"expected one replacement in {path}: {old[:100]!r}")
              path.write_text(text.replace(old, new, 1))

          checkpoint = Path("crates/veyra-cdc/tests/checkpoint_recovery_matrix.rs")
          replace_once(
              checkpoint,
              "use std::path::PathBuf;\nuse std::time::{SystemTime, UNIX_EPOCH};\n",
              "use std::path::PathBuf;\nuse std::sync::atomic::{AtomicU64, Ordering};\nuse std::time::{SystemTime, UNIX_EPOCH};\n",
          )
          replace_once(
              checkpoint,
              "const BODY_LEN: usize = 32;\n\nfn path(label: &str) -> PathBuf {\n",
              "const BODY_LEN: usize = 32;\nstatic PATH_SEQUENCE: AtomicU64 = AtomicU64::new(0);\n\nfn path(label: &str) -> PathBuf {\n",
          )
          replace_once(
              checkpoint,
              '''    std::env::temp_dir().join(format!(
                  "veyra-checkpoint-matrix-{label}-{}-{nanos}.bin",
                  std::process::id()
              ))
          ''',
              '''    let sequence = PATH_SEQUENCE.fetch_add(1, Ordering::Relaxed);
              std::env::temp_dir().join(format!(
                  "veyra-checkpoint-matrix-{label}-{}-{nanos}-{sequence}.bin",
                  std::process::id()
              ))
          ''',
          )

          query = Path("crates/veyra-query/src/lib.rs")
          replace_once(
              query,
              '''        if query
                      .budget
                      .is_some_and(|budget| tagged.solution.total_price > budget)
                  {
                      explain.budget_rejected_properties += 1;
                      continue;
                  }
          ''',
              '''        if let Some(budget) = query.budget
                      && tagged.solution.total_price > budget
                  {
                      explain.budget_rejected_properties += 1;
                      continue;
                  }
          ''',
          )
          replace_once(
              query,
              '''    if query.budget.is_some_and(|budget| budget.get() < 0) {
                  return Err(QueryError::NegativeBudget);
              }
              let party_size = query.party.travelers().len();
              if party_size == 0 || party_size > HARD_MAX_TRAVELERS {
          ''',
              '''    if let Some(budget) = query.budget
                  && budget.get() < 0
              {
                  return Err(QueryError::NegativeBudget);
              }
              let party_size = query.party.travelers().len();
              if party_size == 0 || party_size > HARD_MAX_TRAVELERS {
          ''',
          )
          old_compare = '''fn compare_multi_room_hits(
              left: &MultiRoomSearchHit,
              right: &MultiRoomSearchHit,
              profile: SolutionProfile,
          ) -> Ordering {
              let profile_order = match profile {
                  SolutionProfile::Cheapest => left
                      .projected_price
                      .cmp(&right.projected_price)
                      .then_with(|| left.rooms.len().cmp(&right.rooms.len()))
                      .then_with(|| left.soft_penalty.cmp(&right.soft_penalty)),
                  SolutionProfile::FewestRooms => left
                      .rooms
                      .len()
                      .cmp(&right.rooms.len())
                      .then_with(|| left.projected_price.cmp(&right.projected_price))
                      .then_with(|| left.soft_penalty.cmp(&right.soft_penalty)),
                  SolutionProfile::BestFamilyLayout => left
                      .soft_penalty
                      .cmp(&right.soft_penalty)
                      .then_with(|| left.projected_price.cmp(&right.projected_price))
                      .then_with(|| left.rooms.len().cmp(&right.rooms.len())),
              };
              profile_order
                  .then_with(|| left.property_id.cmp(&right.property_id))
                  .then_with(|| left.rooms.cmp(&right.rooms))
          }
          '''
          new_compare = '''fn compare_multi_room_hits(
              left: &MultiRoomSearchHit,
              right: &MultiRoomSearchHit,
              profile: SolutionProfile,
          ) -> Ordering {
              match profile {
                  SolutionProfile::Cheapest => (
                      left.projected_price,
                      left.rooms.len(),
                      left.soft_penalty,
                      left.property_id,
                      &left.rooms,
                  )
                      .cmp(&(
                          right.projected_price,
                          right.rooms.len(),
                          right.soft_penalty,
                          right.property_id,
                          &right.rooms,
                      )),
                  SolutionProfile::FewestRooms => (
                      left.rooms.len(),
                      left.projected_price,
                      left.soft_penalty,
                      left.property_id,
                      &left.rooms,
                  )
                      .cmp(&(
                          right.rooms.len(),
                          right.projected_price,
                          right.soft_penalty,
                          right.property_id,
                          &right.rooms,
                      )),
                  SolutionProfile::BestFamilyLayout => (
                      left.soft_penalty,
                      left.projected_price,
                      left.rooms.len(),
                      left.property_id,
                      &left.rooms,
                  )
                      .cmp(&(
                          right.soft_penalty,
                          right.projected_price,
                          right.rooms.len(),
                          right.property_id,
                          &right.rooms,
                      )),
              }
          }
          '''
          replace_once(query, old_compare, new_compare)
          PY

      - name: Add exact multi-room coverage matrix
        shell: bash
        run: |
          cat > crates/veyra-query/tests/multi_room_matrix.rs <<'RS'
          use veyra_availability::AvailabilityIndex;
          use veyra_party::{
              AgeEvidence, BookingParty, CivilDate, ConstraintStrength, RoomingIntent,
              RoomingRelation, Traveler, TravelerId,
          };
          use veyra_pricing::{MoneyMicros, OccupancyAdjustment, PriceVector, PricingError};
          use veyra_query::{
              MultiRoomStayQuery, QueryError, RoomDocument, RoomPlacement, RoomSpatialProjection,
              RoomTopologyEdge, RoomTopologyRelation, SearchEngine, SolutionProfile, SolverConfig,
          };
          use veyra_ranking::MAX_TOP_K;
          use veyra_restrictions::{
              RESTRICTION_SCHEMA_V1, RestrictionRule, compile as compile_restrictions,
          };
          use veyra_rule_compiler::{RULE_SCHEMA_V1, compile as compile_rule};
          use veyra_rules::Rule;
          use veyra_solver::{HARD_MAX_ROOMS, SolverError, TopologyError};

          fn date() -> CivilDate {
              CivilDate::new(2026, 9, 21).unwrap_or_else(|_| unreachable!())
          }

          fn money(value: i64) -> MoneyMicros {
              MoneyMicros::try_nonnegative(value).unwrap_or_else(|_| unreachable!())
          }

          fn party(count: u32, relation: Option<RoomingRelation>) -> BookingParty {
              let mut builder = BookingParty::builder();
              for id in 1..=count {
                  builder
                      .add_traveler(Traveler::new(
                          TravelerId::new(id),
                          AgeEvidence::AgeAtCheckIn(30),
                          false,
                      ))
                      .unwrap_or_else(|_| unreachable!());
              }
              if let Some(relation) = relation {
                  builder
                      .add_rooming_intent(RoomingIntent {
                          left: TravelerId::new(1),
                          right: TravelerId::new(2),
                          strength: ConstraintStrength::Must,
                          relation,
                      })
                      .unwrap_or_else(|_| unreachable!());
              }
              builder.build().unwrap_or_else(|_| unreachable!())
          }

          fn restrictions(minimum: u16, maximum: u16) -> veyra_restrictions::CompiledRestrictions {
              compile_restrictions(
                  RESTRICTION_SCHEMA_V1,
                  &[
                      RestrictionRule::MinStay(minimum),
                      RestrictionRule::MaxStay(maximum),
                  ],
              )
              .unwrap_or_else(|_| unreachable!())
          }

          fn room(
              room_id: u32,
              property_id: u32,
              destination_id: u32,
              capacity: u16,
              nightly: i64,
              price_start: i32,
          ) -> RoomDocument {
              RoomDocument {
                  room_id,
                  property_id,
                  destination_id,
                  adult_age: 18,
                  occupancy_rule: compile_rule(
                      RULE_SCHEMA_V1,
                      &Rule::And(vec![
                          Rule::Capacity {
                              min: 1,
                              max: capacity,
                          },
                          Rule::RequireAdult {
                              adult_age: 18,
                              min_adults: 1,
                          },
                      ]),
                  )
                  .unwrap_or_else(|_| unreachable!()),
                  restrictions: restrictions(1, 5),
                  prices: PriceVector::try_new(price_start, vec![money(nightly); 8], 1)
                      .unwrap_or_else(|_| unreachable!()),
                  occupancy_adjustment: OccupancyAdjustment {
                      per_adult_per_night: money(0),
                      per_child_per_night: money(0),
                  },
                  distance_meters: 100,
                  quality_milli: 800,
                  flexibility_milli: 800,
                  family_penalty: 0,
              }
          }

          fn engine(start_day: u32, days: u32, rooms: Vec<RoomDocument>) -> SearchEngine {
              let room_count = u32::try_from(rooms.len()).unwrap_or_else(|_| unreachable!());
              let mut availability = AvailabilityIndex::new(start_day, days, room_count)
                  .unwrap_or_else(|_| unreachable!());
              for room_id in 0..room_count {
                  for day in start_day..start_day + days {
                      availability
                          .set_available(day, room_id, true)
                          .unwrap_or_else(|_| unreachable!());
                  }
              }
              SearchEngine::try_new(availability, rooms).unwrap_or_else(|_| unreachable!())
          }

          fn query<'a>(
              party: &'a BookingParty,
              profile: SolutionProfile,
          ) -> MultiRoomStayQuery<'a> {
              MultiRoomStayQuery {
                  destination_id: 55,
                  check_in_day: 10,
                  check_out_day: 11,
                  check_in_date: date(),
                  party,
                  budget: None,
                  profile,
                  solver: SolverConfig::default(),
                  limit: 10,
              }
          }

          #[test]
          fn spatial_projection_validates_complete_dense_topology() {
              let empty = RoomSpatialProjection::try_new(vec![], vec![])
                  .unwrap_or_else(|_| unreachable!());
              assert!(empty.is_empty());
              assert_eq!(empty.len(), 0);

              let placements = vec![
                  RoomPlacement {
                      room_id: 0,
                      floor: 1,
                      building: 1,
                  },
                  RoomPlacement {
                      room_id: 1,
                      floor: 2,
                      building: 1,
                  },
              ];
              let projection = RoomSpatialProjection::try_new(placements.clone(), vec![])
                  .unwrap_or_else(|_| unreachable!());
              assert!(!projection.is_empty());
              assert_eq!(projection.len(), 2);

              let invalid_edges = [
                  (
                      RoomTopologyEdge {
                          left_room_id: 99,
                          right_room_id: 1,
                          relation: RoomTopologyRelation::Near,
                      },
                      TopologyError::UnknownRoom(99),
                  ),
                  (
                      RoomTopologyEdge {
                          left_room_id: 0,
                          right_room_id: 99,
                          relation: RoomTopologyRelation::Near,
                      },
                      TopologyError::UnknownRoom(99),
                  ),
                  (
                      RoomTopologyEdge {
                          left_room_id: 0,
                          right_room_id: 0,
                          relation: RoomTopologyRelation::Adjacent,
                      },
                      TopologyError::SelfEdge(0),
                  ),
              ];
              for (edge, expected) in invalid_edges {
                  assert_eq!(
                      RoomSpatialProjection::try_new(placements.clone(), vec![edge]),
                      Err(QueryError::Topology(expected))
                  );
              }

              let edge = RoomTopologyEdge {
                  left_room_id: 0,
                  right_room_id: 1,
                  relation: RoomTopologyRelation::Connected,
              };
              assert!(matches!(
                  RoomSpatialProjection::try_new(placements.clone(), vec![edge, edge]),
                  Err(QueryError::Topology(TopologyError::DuplicateEdge { .. }))
              ));

              let availability = AvailabilityIndex::new(10, 1, 2)
                  .unwrap_or_else(|_| unreachable!());
              let incomplete = RoomSpatialProjection::try_new(
                  vec![RoomPlacement {
                      room_id: 0,
                      floor: 1,
                      building: 1,
                  }],
                  vec![],
              )
              .unwrap_or_else(|_| unreachable!());
              assert!(matches!(
                  SearchEngine::try_new_with_spatial(
                      availability,
                      vec![room(0, 1, 55, 2, 100, 10), room(1, 1, 55, 2, 100, 10)],
                      incomplete,
                  ),
                  Err(QueryError::SpatialRoomCountMismatch {
                      expected: 2,
                      actual: 1,
                  })
              ));
          }

          #[test]
          fn multi_room_admission_and_solver_bounds_fail_closed() {
              let one = party(1, None);
              let base = engine(10, 8, vec![room(0, 1, 55, 2, 100, 10)]);

              let mut request = query(&one, SolutionProfile::Cheapest);
              request.limit = 0;
              assert_eq!(base.search_multi_room(&request), Err(QueryError::InvalidLimit(0)));
              request.limit = MAX_TOP_K + 1;
              assert_eq!(
                  base.search_multi_room(&request),
                  Err(QueryError::InvalidLimit(MAX_TOP_K + 1))
              );
              request.limit = 10;
              request.check_out_day = request.check_in_day;
              assert_eq!(
                  base.search_multi_room(&request),
                  Err(QueryError::InvalidStayRange)
              );
              request.check_out_day = 11;
              request.budget = Some(MoneyMicros::signed(-1));
              assert_eq!(
                  base.search_multi_room(&request),
                  Err(QueryError::NegativeBudget)
              );

              let large_party = party(17, None);
              assert_eq!(
                  base.search_multi_room(&query(&large_party, SolutionProfile::Cheapest)),
                  Err(QueryError::SolverPartyTooLarge(17))
              );

              let topology_party = party(2, Some(RoomingRelation::SameFloor));
              assert_eq!(
                  base.search_multi_room(&query(
                      &topology_party,
                      SolutionProfile::Cheapest,
                  )),
                  Err(QueryError::MissingRoomTopology(RoomingRelation::SameFloor))
              );

              let rooms = (0..=HARD_MAX_ROOMS)
                  .map(|index| {
                      room(
                          u32::try_from(index).unwrap_or_else(|_| unreachable!()),
                          9,
                          55,
                          2,
                          100,
                          10,
                      )
                  })
                  .collect::<Vec<_>>();
              let too_many = engine(10, 1, rooms);
              assert!(matches!(
                  too_many.search_multi_room(&query(&one, SolutionProfile::Cheapest)),
                  Err(QueryError::SolverRoomLimit {
                      property_id: 9,
                      rooms,
                  }) if rooms == HARD_MAX_ROOMS + 1
              ));

              let outside_horizon = engine(10, 1, vec![room(0, 1, 55, 2, 100, 20)]);
              assert_eq!(
                  outside_horizon.search_multi_room(&query(&one, SolutionProfile::Cheapest)),
                  Err(QueryError::Pricing(PricingError::OutsidePriceHorizon))
              );

              let two = party(2, None);
              let bounded = engine(
                  10,
                  1,
                  vec![room(0, 1, 55, 1, 100, 10), room(1, 1, 55, 1, 100, 10)],
              );
              let mut request = query(&two, SolutionProfile::Cheapest);
              request.solver = SolverConfig {
                  max_states: 1,
                  max_solutions: 10,
              };
              assert_eq!(
                  bounded.search_multi_room(&request),
                  Err(QueryError::Solver(SolverError::StateBudgetExhausted))
              );
              request.solver = SolverConfig {
                  max_states: 0,
                  max_solutions: 10,
              };
              assert_eq!(
                  bounded.search_multi_room(&request),
                  Err(QueryError::Solver(SolverError::InvalidBudget))
              );
          }

          #[test]
          fn multi_room_service_day_conversions_fail_closed() {
              let one = party(1, None);
              let beyond = u32::try_from(i32::MAX)
                  .unwrap_or_else(|_| unreachable!())
                  .saturating_add(1);
              let high = engine(beyond, 2, vec![room(0, 1, 55, 2, 100, 0)]);
              let request = MultiRoomStayQuery {
                  destination_id: 55,
                  check_in_day: beyond,
                  check_out_day: beyond + 1,
                  check_in_date: date(),
                  party: &one,
                  budget: None,
                  profile: SolutionProfile::Cheapest,
                  solver: SolverConfig::default(),
                  limit: 10,
              };
              assert_eq!(
                  high.search_multi_room(&request),
                  Err(QueryError::ServiceDayOutOfRange)
              );

              let boundary = u32::try_from(i32::MAX).unwrap_or_else(|_| unreachable!());
              let high = engine(boundary, 2, vec![room(0, 1, 55, 2, 100, 0)]);
              let request = MultiRoomStayQuery {
                  destination_id: 55,
                  check_in_day: boundary,
                  check_out_day: boundary + 1,
                  check_in_date: date(),
                  party: &one,
                  budget: None,
                  profile: SolutionProfile::Cheapest,
                  solver: SolverConfig::default(),
                  limit: 10,
              };
              assert_eq!(
                  high.search_multi_room(&request),
                  Err(QueryError::ServiceDayOutOfRange)
              );
          }

          #[test]
          fn explain_tracks_infeasible_budget_destination_and_restriction_paths() {
              let travelers = party(2, None);
              let mut rooms = vec![
                  room(0, 1, 55, 2, 200, 10),
                  room(1, 2, 55, 1, 100, 10),
                  room(2, 3, 55, 2, 1_000, 10),
                  room(3, 4, 99, 2, 100, 10),
                  room(4, 5, 55, 2, 100, 10),
              ];
              rooms[4].restrictions = restrictions(2, 5);
              let engine = engine(10, 1, rooms);
              let mut request = query(&travelers, SolutionProfile::Cheapest);
              request.budget = Some(money(500));

              let result = engine
                  .search_multi_room(&request)
                  .unwrap_or_else(|_| unreachable!());
              assert_eq!(result.hits.len(), 1);
              assert_eq!(result.hits[0].property_id, 1);
              assert_eq!(result.explain.destination_candidates, 4);
              assert_eq!(result.explain.restriction_candidates, 3);
              assert_eq!(result.explain.properties_considered, 3);
              assert_eq!(result.explain.properties_solved, 2);
              assert_eq!(result.explain.infeasible_properties, 1);
              assert_eq!(result.explain.budget_rejected_properties, 1);
              assert_eq!(result.explain.returned, 1);
          }

          #[test]
          fn all_solution_profiles_sort_and_limit_deterministically() {
              let travelers = party(2, None);
              let rooms = vec![
                  room(0, 1, 55, 2, 200, 10),
                  room(1, 2, 55, 1, 100, 10),
                  room(2, 2, 55, 1, 100, 10),
                  room(3, 3, 55, 2, 200, 10),
                  room(4, 4, 55, 2, 200, 10),
              ];
              let engine = engine(10, 1, rooms);

              for profile in [
                  SolutionProfile::Cheapest,
                  SolutionProfile::FewestRooms,
                  SolutionProfile::BestFamilyLayout,
              ] {
                  let mut request = query(&travelers, profile);
                  request.limit = 3;
                  let result = engine
                      .search_multi_room(&request)
                      .unwrap_or_else(|_| unreachable!());
                  assert_eq!(
                      result
                          .hits
                          .iter()
                          .map(|hit| hit.property_id)
                          .collect::<Vec<_>>(),
                      vec![1, 3, 4]
                  );
                  assert_eq!(result.explain.returned, 3);
              }
          }
          RS

      - name: Add topology, solver, runtime, segment, and server coverage regressions
        shell: bash
        run: |
          cat > crates/veyra-solver/tests/topology_coverage.rs <<'RS'
          use veyra_solver::{
              RoomRelationIndex, RoomTopologyEdge, RoomTopologyRelation, TopologyError,
          };

          #[test]
          fn topology_index_normalizes_and_exposes_every_boundary() {
              assert_eq!(
                  RoomRelationIndex::try_new(&[7, 7], &[]),
                  Err(TopologyError::DuplicateRoom(7))
              );
              assert_eq!(
                  RoomRelationIndex::try_new(
                      &[7, 8],
                      &[RoomTopologyEdge {
                          left_room_id: 99,
                          right_room_id: 8,
                          relation: RoomTopologyRelation::Near,
                      }],
                  ),
                  Err(TopologyError::UnknownRoom(99))
              );

              let index = RoomRelationIndex::try_new(
                  &[7, 8],
                  &[RoomTopologyEdge {
                      left_room_id: 8,
                      right_room_id: 7,
                      relation: RoomTopologyRelation::Adjacent,
                  }],
              )
              .unwrap_or_else(|_| unreachable!());
              assert!(index.contains_room(7));
              assert!(!index.contains_room(99));
              assert!(index.contains(RoomTopologyRelation::Adjacent, 7, 8));
              assert!(index.contains(RoomTopologyRelation::Adjacent, 8, 7));
              assert!(!index.contains(RoomTopologyRelation::Adjacent, 7, 7));
              assert!(!index.contains(RoomTopologyRelation::Connected, 7, 8));

              for error in [
                  TopologyError::DuplicateRoom(7),
                  TopologyError::UnknownRoom(9),
                  TopologyError::SelfEdge(7),
                  TopologyError::DuplicateEdge {
                      left_room_id: 7,
                      right_room_id: 8,
                      relation: RoomTopologyRelation::Near,
                  },
              ] {
                  assert!(!error.to_string().is_empty());
              }
          }
          RS

          cat > crates/veyra-solver/tests/edge_matrix.rs <<'RS'
          use veyra_party::{
              AgeEvidence, BookingParty, CivilDate, ConstraintStrength, RoomingIntent,
              RoomingRelation, Traveler, TravelerId,
          };
          use veyra_pricing::{MoneyMicros, OccupancyAdjustment, PriceVector};
          use veyra_rule_compiler::{RULE_SCHEMA_V1, compile};
          use veyra_rules::Rule;
          use veyra_solver::{
              PricedRoomOffer, RoomRelationIndex, RoomTopologyEdge, RoomTopologyRelation,
              SolverConfig, SolverError, solve_priced, solve_priced_with_topology,
          };

          fn date() -> CivilDate {
              CivilDate::new(2026, 9, 21).unwrap_or_else(|_| unreachable!())
          }

          fn money(value: i64) -> MoneyMicros {
              MoneyMicros::try_nonnegative(value).unwrap_or_else(|_| unreachable!())
          }

          fn party(relation: Option<RoomingRelation>) -> BookingParty {
              let mut builder = BookingParty::builder();
              for id in 1..=2 {
                  builder
                      .add_traveler(Traveler::new(
                          TravelerId::new(id),
                          AgeEvidence::AgeAtCheckIn(30),
                          false,
                      ))
                      .unwrap_or_else(|_| unreachable!());
              }
              if let Some(relation) = relation {
                  builder
                      .add_rooming_intent(RoomingIntent {
                          left: TravelerId::new(1),
                          right: TravelerId::new(2),
                          strength: ConstraintStrength::Must,
                          relation,
                      })
                      .unwrap_or_else(|_| unreachable!());
              }
              builder.build().unwrap_or_else(|_| unreachable!())
          }

          fn room(id: u32, floor: u16, building: u16, capacity: u16) -> PricedRoomOffer {
              PricedRoomOffer {
                  room_id: id,
                  prices: PriceVector::try_new(10, vec![money(100)], 1)
                      .unwrap_or_else(|_| unreachable!()),
                  occupancy_adjustment: OccupancyAdjustment {
                      per_adult_per_night: money(0),
                      per_child_per_night: money(0),
                  },
                  floor,
                  building,
                  adult_age: 18,
                  occupancy_rule: compile(
                      RULE_SCHEMA_V1,
                      &Rule::Capacity {
                          min: 1,
                          max: capacity,
                      },
                  )
                  .unwrap_or_else(|_| unreachable!()),
              }
          }

          #[test]
          fn priced_entry_points_reject_invalid_stays_before_search() {
              let party = party(None);
              let offers = [room(10, 1, 1, 2)];
              assert_eq!(
                  solve_priced(&party, date(), 10, 10, &offers, SolverConfig::default()),
                  Err(SolverError::InvalidStayRange)
              );
              let topology = RoomRelationIndex::try_new(&[10], &[])
                  .unwrap_or_else(|_| unreachable!());
              assert_eq!(
                  solve_priced_with_topology(
                      &party,
                      date(),
                      11,
                      10,
                      &offers,
                      &topology,
                      SolverConfig::default(),
                  ),
                  Err(SolverError::InvalidStayRange)
              );
          }

          #[test]
          fn topology_must_cover_every_offered_room() {
              let topology = RoomRelationIndex::try_new(&[10], &[])
                  .unwrap_or_else(|_| unreachable!());
              assert_eq!(
                  solve_priced_with_topology(
                      &party(None),
                      date(),
                      10,
                      11,
                      &[room(11, 1, 1, 2)],
                      &topology,
                      SolverConfig::default(),
                  ),
                  Err(SolverError::TopologyMissingRoom(11))
              );
          }

          #[test]
          fn every_spatial_relation_executes_true_and_false_paths() {
              let offers = [room(10, 1, 1, 1), room(11, 2, 2, 1)];
              let topology = RoomRelationIndex::try_new(
                  &[10, 11],
                  &[
                      RoomTopologyEdge {
                          left_room_id: 10,
                          right_room_id: 11,
                          relation: RoomTopologyRelation::Near,
                      },
                      RoomTopologyEdge {
                          left_room_id: 10,
                          right_room_id: 11,
                          relation: RoomTopologyRelation::Adjacent,
                      },
                      RoomTopologyEdge {
                          left_room_id: 10,
                          right_room_id: 11,
                          relation: RoomTopologyRelation::Connected,
                      },
                  ],
              )
              .unwrap_or_else(|_| unreachable!());

              for relation in [
                  RoomingRelation::Near,
                  RoomingRelation::AdjacentRooms,
                  RoomingRelation::ConnectedRooms,
              ] {
                  let result = solve_priced_with_topology(
                      &party(Some(relation)),
                      date(),
                      10,
                      11,
                      &offers,
                      &topology,
                      SolverConfig::default(),
                  )
                  .unwrap_or_else(|_| unreachable!());
                  assert_eq!(result.valid_solution_count, 2);
              }

              for relation in [RoomingRelation::SameFloor, RoomingRelation::SameBuilding] {
                  let result = solve_priced_with_topology(
                      &party(Some(relation)),
                      date(),
                      10,
                      11,
                      &offers,
                      &topology,
                      SolverConfig::default(),
                  )
                  .unwrap_or_else(|_| unreachable!());
                  assert_eq!(result.valid_solution_count, 0);
              }

              let one_room = [room(10, 1, 1, 2)];
              let one_topology = RoomRelationIndex::try_new(&[10], &[])
                  .unwrap_or_else(|_| unreachable!());
              for relation in [
                  RoomingRelation::AdjacentRooms,
                  RoomingRelation::ConnectedRooms,
              ] {
                  let result = solve_priced_with_topology(
                      &party(Some(relation)),
                      date(),
                      10,
                      11,
                      &one_room,
                      &one_topology,
                      SolverConfig::default(),
                  )
                  .unwrap_or_else(|_| unreachable!());
                  assert_eq!(result.valid_solution_count, 0);
              }
          }
          RS

