name: Coverage and portability hardening source plan

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-plan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Fix deterministic temporary paths and simplify comparator coverage surface
        shell: bash
        run: |
          echo '' | base64 -d | python3

      - name: Add exact multi-room coverage matrix
        shell: bash
        run: |
          echo '' | base64 -d | python3

      - name: Add topology, solver, runtime, segment, and server coverage regressions
        shell: bash
        run: |
          echo '' | base64 -d > crates/veyra-server/tests/query_success_matrix.rs
          if ! grep -q 'mod private_region_coverage' crates/veyra-solver/src/lib.rs; then echo '' | base64 -d >> crates/veyra-solver/src/lib.rs; fi
          if ! grep -q 'mod private_transition_coverage' crates/veyra-cdc/src/checkpoint.rs; then echo '' | base64 -d >> crates/veyra-cdc/src/checkpoint.rs; fi
          if ! grep -q 'mod private_journal_coverage' crates/veyra-cdc/src/journal_v2.rs; then echo '' | base64 -d >> crates/veyra-cdc/src/journal_v2.rs; fi
          if ! grep -q 'mod private_segment_coverage' crates/veyra-segment/src/lib.rs; then echo '' | base64 -d >> crates/veyra-segment/src/lib.rs; fi
