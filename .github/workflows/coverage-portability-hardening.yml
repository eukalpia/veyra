name: Coverage and portability hardening source plan

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-plan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Fix deterministic temporary paths and simplify comparator coverage surface
        shell: bash
        run: |
          python3 tools/final-hardening/apply.py transform

      - name: Add exact multi-room coverage matrix
        shell: bash
        run: |
          python3 tools/final-hardening/apply.py lifetime
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/veyra-query/tests/multi_room_matrix.rs')
          text = path.read_text()
          compact = "fn query<'a>(party: &'a BookingParty, profile: SolutionProfile) -> MultiRoomStayQuery<'a> {\n"
          expanded = """fn query<'a>(
              party: &'a BookingParty,
              profile: SolutionProfile,
          ) -> MultiRoomStayQuery<'a> {
          """
          if compact in text:
              path.write_text(text.replace(compact, expanded, 1))
          elif expanded not in text:
              raise SystemExit('explicit lifetime helper contract not found')
          PY

      - name: Add topology, solver, runtime, segment, and server coverage regressions
        shell: bash
        run: |
          python3 tools/final-hardening/apply.py tests
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/veyra-server/tests/query_success_matrix.rs')
          text = path.read_text()
          old = '.unwrap_err();'
          new = '.err().unwrap_or_else(|| unreachable!());'
          if old in text:
              if text.count(old) != 1:
                  raise SystemExit('server unwrap_err site is not unique')
              path.write_text(text.replace(old, new, 1))
          elif new not in text:
              raise SystemExit('server error extraction site not found')
          PY
