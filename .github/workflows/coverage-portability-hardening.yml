          cat >> crates/veyra-server/tests/query_boundary.rs <<'RS'

          #[test]
          fn single_room_service_entry_and_error_display_are_stable() {
              use veyra_query::{QueryError, StayQuery};
              use veyra_ranking::{RankingKind, RankingProfile};

              let initial = PublishedGeneration::<SearchEngine>::try_without_payload(
                  RuntimeSnapshot::starting(GenerationId::UNPUBLISHED, ProjectionProgress::ZERO),
              )
              .unwrap_or_else(|_| unreachable!());
              let service = QueryService::new(GenerationState::new(initial));
              let party = party();
              let request = StayQuery {
                  destination_id: 1,
                  check_in_day: 10,
                  check_out_day: 11,
                  check_in_date: date(2026, 9, 21),
                  party: &party,
                  budget: None,
                  ranking: RankingProfile::v1(RankingKind::Cheapest),
                  limit: 10,
              };

              let error = service
                  .search(LogSequenceNumber::ZERO, &request)
                  .err()
                  .unwrap_or_else(|| unreachable!());
              assert_eq!(
                  error,
                  ServiceQueryError::CannotProve(CannotProveReason::NotReady)
              );
              assert_eq!(error.to_string(), "not_ready: CannotProve(NotReady)");

              let unsupported = ServiceQueryError::Query(QueryError::MissingRoomTopology(
                  veyra_party::RoomingRelation::SameFloor,
              ));
              assert_eq!(unsupported.code(), "unsupported_semantics");
              assert!(unsupported.to_string().starts_with("unsupported_semantics:"));

              let rejected = ServiceQueryError::Query(QueryError::InvalidLimit(0));
              assert_eq!(rejected.code(), "query_rejected");
              assert!(rejected.to_string().starts_with("query_rejected:"));
          }
