name: Add server boundary tests

on:
  push:
    branches:
      - agent/v1-production-completion
    paths:
      - .github/workflows/add-server-boundary-tests.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: veyra-v1-branch-writer
  cancel-in-progress: false

jobs:
  add-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/v1-production-completion
          fetch-depth: 0
      - name: Install pinned Rust
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - name: Add HTTP rejection matrix from existing test fixture
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("crates/veyra-server/tests/query_boundary.rs")
          text = path.read_text()
          marker = "http_boundary_rejection_matrix"
          if marker in text:
              raise SystemExit(0)

          helper_matches = re.findall(r"let\s+\w+\s*=\s*([A-Za-z_][A-Za-z0-9_]*)\(\)\s*(\.await)?\s*;", text)
          if not helper_matches:
              raise RuntimeError("no zero-argument server fixture call found")
          helper, await_suffix = helper_matches[0]
          helper_call = f"{helper}()" + (".await" if await_suffix else "")

          paths = re.findall(r"\.uri\(\s*\"([^\"]+)\"\s*\)", text)
          query_paths = [candidate for candidate in paths if "query" in candidate or "search" in candidate]
          if not query_paths:
              raise RuntimeError(f"query path not found in {paths}")
          query_path = query_paths[0]

          addition = f'''

use axum::body::Body as QualificationBody;
use axum::http::{{Method as QualificationMethod, Request as QualificationRequest, StatusCode as QualificationStatus}};
use tower::ServiceExt as QualificationServiceExt;

#[tokio::test]
async fn http_boundary_rejection_matrix() {{
    let app = {helper_call};

    let malformed = QualificationRequest::builder()
        .method(QualificationMethod::POST)
        .uri("{query_path}")
        .header("content-type", "application/json")
        .body(QualificationBody::from("{{"))
        .unwrap_or_else(|_| unreachable!());
    let malformed = app
        .clone()
        .oneshot(malformed)
        .await
        .unwrap_or_else(|_| unreachable!());
    assert!(matches!(
        malformed.status(),
        QualificationStatus::BAD_REQUEST | QualificationStatus::UNPROCESSABLE_ENTITY
    ));

    let wrong_method = QualificationRequest::builder()
        .method(QualificationMethod::GET)
        .uri("{query_path}")
        .body(QualificationBody::empty())
        .unwrap_or_else(|_| unreachable!());
    let wrong_method = app
        .clone()
        .oneshot(wrong_method)
        .await
        .unwrap_or_else(|_| unreachable!());
    assert_eq!(wrong_method.status(), QualificationStatus::METHOD_NOT_ALLOWED);

    let unknown = QualificationRequest::builder()
        .method(QualificationMethod::GET)
        .uri("/__veyra_missing_route__")
        .body(QualificationBody::empty())
        .unwrap_or_else(|_| unreachable!());
    let unknown = app
        .oneshot(unknown)
        .await
        .unwrap_or_else(|_| unreachable!());
    assert_eq!(unknown.status(), QualificationStatus::NOT_FOUND);
}}
'''
          path.write_text(text.rstrip() + addition + "\n")
          PY
      - name: Format
        run: cargo fmt --all
      - name: Verify server tests and clippy
        run: |
          cargo test -p veyra-server --all-features --locked
          cargo clippy -p veyra-server --all-targets --all-features --locked -- -D warnings
      - name: Commit tests
        shell: bash
        run: |
          git rm .github/workflows/add-server-boundary-tests.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/veyra-server/tests/query_boundary.rs
          git commit -m "test: qualify HTTP boundary rejection matrix"
          git fetch origin agent/v1-production-completion
          git rebase origin/agent/v1-production-completion
          git push origin HEAD:agent/v1-production-completion
