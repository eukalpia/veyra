name: Solver topology TDD gate

on:
  push:
    branches:
      - agent/v1-production-completion
    paths:
      - .github/workflows/solver-topology-tdd.yml
      - tools/staged/solver_topology.rs
      - tools/staged/apply_solver_topology.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/v1-production-completion
      - name: Install pinned Rust
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - name: Install topology implementation
        run: |
          cp tools/staged/solver_topology.rs crates/veyra-solver/src/topology.rs
          python3 tools/staged/apply_solver_topology.py
      - name: Format workspace
        run: cargo fmt --all
      - name: Strict solver clippy
        run: cargo clippy -p veyra-solver --all-targets --all-features --locked -- -D warnings
      - name: Solver tests
        run: cargo test -p veyra-solver --all-features --locked
      - name: Commit verified topology implementation
        shell: bash
        run: |
          git rm tools/staged/solver_topology.rs tools/staged/apply_solver_topology.py .github/workflows/solver-topology-tdd.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/veyra-solver/src/lib.rs crates/veyra-solver/src/topology.rs
          git commit -m "feat: prove explicit room topology constraints"
          git push origin HEAD:agent/v1-production-completion
