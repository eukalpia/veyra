name: Solver topology TDD gate

on:
  push:
    branches:
      - agent/v1-production-completion
    paths:
      - .github/workflows/solver-topology-tdd.yml
      - crates/veyra-solver/tests/topology.rs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  topology-red:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/v1-production-completion
      - name: Install pinned Rust
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Run topology regression
        run: cargo test -p veyra-solver --test topology --locked -- --nocapture
