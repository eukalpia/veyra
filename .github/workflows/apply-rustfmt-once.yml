name: Apply rustfmt once

on:
  push:
    branches:
      - agent/m0-foundation-ci
    paths:
      - .github/rustfmt-once/READY

permissions:
  contents: write

concurrency:
  group: apply-rustfmt-once-${{ github.ref }}
  cancel-in-progress: false

jobs:
  format:
    name: Format workspace and self-remove
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/m0-foundation-ci
          fetch-depth: 0
      - name: Install pinned rustfmt
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt
      - name: Format and commit
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git rm .github/rustfmt-once/READY
          git rm .github/workflows/apply-rustfmt-once.yml
          git config user.name "Veyra CI"
          git config user.email "120781817+eukalpia@users.noreply.github.com"
          git add -A
          git commit -m "style: apply pinned rustfmt"
          git push origin HEAD:agent/m0-foundation-ci
