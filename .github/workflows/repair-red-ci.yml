name: Repair red CI and semantic serde boundaries

on:
  push:
    branches:
      - agent/v1-production-completion
    paths:
      - .github/workflows/repair-red-ci.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-red-ci
  cancel-in-progress: false

jobs:
  repair-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/v1-production-completion
          fetch-depth: 0

      - name: Install pinned Rust
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy

      - name: Restore validated serde construction boundaries
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text()
              if new in text:
                  return
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one replacement in {path}: {old[:120]!r}")
              path.write_text(text.replace(old, new, 1))

          types = Path("crates/veyra-types/src/lib.rs")
          replace_once(
              types,
              '''#[derive(Clone, Copy, Debug, Deserialize, Eq, PartialEq, Serialize)]
          pub struct ProjectionProgress {
              received: LogSequenceNumber,
              durable: LogSequenceNumber,
              applied: LogSequenceNumber,
              published: LogSequenceNumber,
          }
          ''',
              '''#[derive(Clone, Copy, Debug, Deserialize, Eq, PartialEq, Serialize)]
          #[serde(try_from = "ProjectionProgressWire")]
          pub struct ProjectionProgress {
              received: LogSequenceNumber,
              durable: LogSequenceNumber,
              applied: LogSequenceNumber,
              published: LogSequenceNumber,
          }

          #[derive(Clone, Copy, Debug, Deserialize)]
          struct ProjectionProgressWire {
              received: LogSequenceNumber,
              durable: LogSequenceNumber,
              applied: LogSequenceNumber,
              published: LogSequenceNumber,
          }

          impl TryFrom<ProjectionProgressWire> for ProjectionProgress {
              type Error = ProjectionProgressError;

              fn try_from(raw: ProjectionProgressWire) -> Result<Self, Self::Error> {
                  Self::try_new(raw.received, raw.durable, raw.applied, raw.published)
              }
          }
          ''',
          )

          transaction = Path("crates/veyra-cdc/src/transaction_v1.rs")
          replace_once(
              transaction,
              '''#[derive(Clone, Debug, Deserialize, Eq, PartialEq, Serialize)]
          pub struct TransactionBatch {
              xid: u32,
              final_lsn: LogSequenceNumber,
              commit_lsn: LogSequenceNumber,
              end_lsn: LogSequenceNumber,
              changes: Vec<RowChange>,
          }
          ''',
              '''#[derive(Clone, Debug, Deserialize, Eq, PartialEq, Serialize)]
          #[serde(try_from = "TransactionBatchWire")]
          pub struct TransactionBatch {
              xid: u32,
              final_lsn: LogSequenceNumber,
              commit_lsn: LogSequenceNumber,
              end_lsn: LogSequenceNumber,
              changes: Vec<RowChange>,
          }

          #[derive(Clone, Debug, Deserialize)]
          struct TransactionBatchWire {
              xid: u32,
              final_lsn: LogSequenceNumber,
              commit_lsn: LogSequenceNumber,
              end_lsn: LogSequenceNumber,
              changes: Vec<RowChange>,
          }

          impl TryFrom<TransactionBatchWire> for TransactionBatch {
              type Error = TransactionValidationError;

              fn try_from(raw: TransactionBatchWire) -> Result<Self, Self::Error> {
                  Self::try_new(
                      raw.xid,
                      raw.final_lsn,
                      raw.commit_lsn,
                      raw.end_lsn,
                      raw.changes,
                  )
              }
          }
          ''',
          )
          replace_once(
              transaction,
              '''        if end_lsn < commit_lsn {
                      return Err(TransactionValidationError::EndBeforeCommit);
                  }
          ''',
              '''        if commit_lsn < final_lsn {
                      return Err(TransactionValidationError::CommitBeforeFinal);
                  }
                  if end_lsn < commit_lsn {
                      return Err(TransactionValidationError::EndBeforeCommit);
                  }
          ''',
          )
          replace_once(
              transaction,
              '''pub enum TransactionValidationError {
              EndBeforeCommit,
          }

          impl fmt::Display for TransactionValidationError {
              fn fmt(&self, formatter: &mut fmt::Formatter<'_>) -> fmt::Result {
                  formatter.write_str("end_lsn is before commit_lsn")
              }
          }
          ''',
              '''pub enum TransactionValidationError {
              CommitBeforeFinal,
              EndBeforeCommit,
          }

          impl fmt::Display for TransactionValidationError {
              fn fmt(&self, formatter: &mut fmt::Formatter<'_>) -> fmt::Result {
                  formatter.write_str(match self {
                      Self::CommitBeforeFinal => "commit_lsn is before final_lsn",
                      Self::EndBeforeCommit => "end_lsn is before commit_lsn",
                  })
              }
          }
          ''',
          )
          replace_once(
              transaction,
              '''    #[test]
              fn batch_rejects_end_before_commit() {
                  assert_eq!(
                      TransactionBatch::try_new(1, lsn(3), lsn(3), lsn(2), Vec::new()),
                      Err(TransactionValidationError::EndBeforeCommit)
                  );
              }
          ''',
              '''    #[test]
              fn batch_rejects_invalid_lsn_order() {
                  assert_eq!(
                      TransactionBatch::try_new(1, lsn(3), lsn(2), lsn(4), Vec::new()),
                      Err(TransactionValidationError::CommitBeforeFinal)
                  );
                  assert_eq!(
                      TransactionBatch::try_new(1, lsn(3), lsn(3), lsn(2), Vec::new()),
                      Err(TransactionValidationError::EndBeforeCommit)
                  );
              }
          ''',
          )
          replace_once(
              transaction,
              '''        assert_eq!(
                      TransactionValidationError::EndBeforeCommit.to_string(),
                      "end_lsn is before commit_lsn"
                  );
          ''',
              '''        assert_eq!(
                      TransactionValidationError::CommitBeforeFinal.to_string(),
                      "commit_lsn is before final_lsn"
                  );
                  assert_eq!(
                      TransactionValidationError::EndBeforeCommit.to_string(),
                      "end_lsn is before commit_lsn"
                  );
          ''',
          )

          runtime = Path("crates/veyra-runtime/src/lib.rs")
          replace_once(
              runtime,
              '''#[derive(Clone, Debug, Deserialize, Eq, PartialEq, Serialize)]
          pub struct RuntimeSnapshot {
              phase: ServicePhase,
              generation: GenerationId,
              progress: ProjectionProgress,
              cannot_prove: Option<CannotProveReason>,
          }
          ''',
              '''#[derive(Clone, Debug, Deserialize, Eq, PartialEq, Serialize)]
          #[serde(try_from = "RuntimeSnapshotWire")]
          pub struct RuntimeSnapshot {
              phase: ServicePhase,
              generation: GenerationId,
              progress: ProjectionProgress,
              cannot_prove: Option<CannotProveReason>,
          }

          #[derive(Clone, Copy, Debug, Deserialize)]
          struct RuntimeSnapshotWire {
              phase: ServicePhase,
              generation: GenerationId,
              progress: ProjectionProgress,
              cannot_prove: Option<CannotProveReason>,
          }

          #[derive(Clone, Copy, Debug, Eq, PartialEq)]
          enum RuntimeSnapshotInvariantError {
              ReadyWithReason,
              NonReadyWithoutReason,
          }

          impl fmt::Display for RuntimeSnapshotInvariantError {
              fn fmt(&self, formatter: &mut fmt::Formatter<'_>) -> fmt::Result {
                  formatter.write_str(match self {
                      Self::ReadyWithReason => {
                          "ready runtime snapshot cannot include a cannot_prove reason"
                      }
                      Self::NonReadyWithoutReason => {
                          "non-ready runtime snapshot requires a cannot_prove reason"
                      }
                  })
              }
          }

          impl TryFrom<RuntimeSnapshotWire> for RuntimeSnapshot {
              type Error = RuntimeSnapshotInvariantError;

              fn try_from(raw: RuntimeSnapshotWire) -> Result<Self, Self::Error> {
                  if raw.phase == ServicePhase::Ready {
                      if raw.cannot_prove.is_some() {
                          return Err(RuntimeSnapshotInvariantError::ReadyWithReason);
                      }
                  } else if raw.cannot_prove.is_none() {
                      return Err(RuntimeSnapshotInvariantError::NonReadyWithoutReason);
                  }

                  Ok(Self {
                      phase: raw.phase,
                      generation: raw.generation,
                      progress: raw.progress,
                      cannot_prove: raw.cannot_prove,
                  })
              }
          }
          ''',
          )

          Path("crates/veyra-types/tests/serde_invariants.rs").write_text('''use veyra_types::{LogSequenceNumber, ProjectionProgress};

          #[test]
          fn serde_rejects_durable_progress_ahead_of_received() {
              let invalid = r#"{
                  "received": 10,
                  "durable": 11,
                  "applied": 9,
                  "published": 8
              }"#;

              assert!(serde_json::from_str::<ProjectionProgress>(invalid).is_err());
          }

          #[test]
          fn serde_rejects_applied_progress_ahead_of_durable() {
              let invalid = r#"{
                  "received": 10,
                  "durable": 8,
                  "applied": 9,
                  "published": 7
              }"#;

              assert!(serde_json::from_str::<ProjectionProgress>(invalid).is_err());
          }

          #[test]
          fn serde_rejects_published_progress_ahead_of_applied() {
              let invalid = r#"{
                  "received": 10,
                  "durable": 10,
                  "applied": 8,
                  "published": 9
              }"#;

              assert!(serde_json::from_str::<ProjectionProgress>(invalid).is_err());
          }

          #[test]
          fn serde_accepts_an_ordered_progress_chain() {
              let valid = r#"{
                  "received": 10,
                  "durable": 9,
                  "applied": 8,
                  "published": 7
              }"#;

              let progress = serde_json::from_str::<ProjectionProgress>(valid)
                  .unwrap_or_else(|_| unreachable!());
              assert_eq!(progress.received(), LogSequenceNumber::new(10));
              assert_eq!(progress.durable(), LogSequenceNumber::new(9));
              assert_eq!(progress.applied(), LogSequenceNumber::new(8));
              assert_eq!(progress.published(), LogSequenceNumber::new(7));
          }
          ''')

          Path("crates/veyra-cdc/tests/serde_invariants.rs").write_text('''use veyra_cdc::TransactionBatch;
          use veyra_types::LogSequenceNumber;

          #[test]
          fn serde_rejects_commit_lsn_before_final_lsn() {
              let invalid = r#"{
                  "xid": 42,
                  "final_lsn": 20,
                  "commit_lsn": 19,
                  "end_lsn": 21,
                  "changes": []
              }"#;

              assert!(serde_json::from_str::<TransactionBatch>(invalid).is_err());
          }

          #[test]
          fn serde_rejects_end_lsn_before_commit_lsn() {
              let invalid = r#"{
                  "xid": 42,
                  "final_lsn": 20,
                  "commit_lsn": 21,
                  "end_lsn": 20,
                  "changes": []
              }"#;

              assert!(serde_json::from_str::<TransactionBatch>(invalid).is_err());
          }

          #[test]
          fn serde_accepts_an_ordered_transaction_boundary() {
              let valid = r#"{
                  "xid": 42,
                  "final_lsn": 20,
                  "commit_lsn": 20,
                  "end_lsn": 21,
                  "changes": []
              }"#;

              let transaction = serde_json::from_str::<TransactionBatch>(valid)
                  .unwrap_or_else(|_| unreachable!());
              assert_eq!(transaction.xid(), 42);
              assert_eq!(transaction.final_lsn(), LogSequenceNumber::new(20));
              assert_eq!(transaction.commit_lsn(), LogSequenceNumber::new(20));
              assert_eq!(transaction.end_lsn(), LogSequenceNumber::new(21));
          }
          ''')

          Path("crates/veyra-runtime/tests/serde_invariants.rs").write_text('''use veyra_runtime::{CannotProveReason, RuntimeSnapshot, ServicePhase};
          use veyra_types::{GenerationId, LogSequenceNumber};

          #[test]
          fn serde_rejects_non_ready_runtime_without_fail_closed_reason() {
              let invalid = r#"{
                  "phase": "starting",
                  "generation": 0,
                  "progress": {
                      "received": 0,
                      "durable": 0,
                      "applied": 0,
                      "published": 0
                  },
                  "cannot_prove": null
              }"#;

              assert!(serde_json::from_str::<RuntimeSnapshot>(invalid).is_err());
          }

          #[test]
          fn serde_rejects_ready_runtime_with_cannot_prove_reason() {
              let invalid = r#"{
                  "phase": "ready",
                  "generation": 7,
                  "progress": {
                      "received": 10,
                      "durable": 10,
                      "applied": 10,
                      "published": 10
                  },
                  "cannot_prove": "cdc_gap"
              }"#;

              assert!(serde_json::from_str::<RuntimeSnapshot>(invalid).is_err());
          }

          #[test]
          fn serde_accepts_ready_runtime_without_reason() {
              let valid = r#"{
                  "phase": "ready",
                  "generation": 7,
                  "progress": {
                      "received": 10,
                      "durable": 10,
                      "applied": 10,
                      "published": 10
                  },
                  "cannot_prove": null
              }"#;

              let snapshot = serde_json::from_str::<RuntimeSnapshot>(valid)
                  .unwrap_or_else(|_| unreachable!());
              assert_eq!(snapshot.phase(), ServicePhase::Ready);
              assert_eq!(snapshot.generation(), GenerationId::new(7));
              assert_eq!(snapshot.cannot_prove_reason(), None);
              assert_eq!(
                  snapshot.prove_queryable(LogSequenceNumber::new(10)),
                  Ok(())
              );
          }

          #[test]
          fn serde_accepts_non_ready_runtime_with_reason() {
              let valid = r#"{
                  "phase": "degraded",
                  "generation": 7,
                  "progress": {
                      "received": 10,
                      "durable": 10,
                      "applied": 10,
                      "published": 10
                  },
                  "cannot_prove": "cdc_gap"
              }"#;

              let snapshot = serde_json::from_str::<RuntimeSnapshot>(valid)
                  .unwrap_or_else(|_| unreachable!());
              assert_eq!(snapshot.phase(), ServicePhase::Degraded);
              assert_eq!(
                  snapshot.cannot_prove_reason(),
                  Some(CannotProveReason::CdcGap)
              );
              assert_eq!(
                  snapshot.prove_queryable(LogSequenceNumber::ZERO),
                  Err(CannotProveReason::CdcGap)
              );
          }
          ''')
          PY

      - name: Format the complete workspace
        run: cargo fmt --all

      - name: Verify locked dependency graphs
        run: |
          cargo metadata --locked --format-version 1 > /dev/null
          (cd fuzz && cargo metadata --locked --format-version 1 > /dev/null)

      - name: Prove serde regressions are green
        run: |
          cargo test -p veyra-types --test serde_invariants --locked
          cargo test -p veyra-cdc --test serde_invariants --locked
          cargo test -p veyra-runtime --test serde_invariants --locked

      - name: Verify full workspace before publishing fix
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-features --locked

      - name: Remove obsolete one-shot CI machinery
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          keep = {
              "ci.yml",
              "cdc-regression.yml",
              "source-snapshot.yml",
              "v1-final-qualification-v2.yml",
              "repair-red-ci.yml",
          }
          for path in Path(".github/workflows").glob("*.yml"):
              if path.name not in keep:
                  path.unlink()

          for path in [
              Path(".github/clippy-hardening/READY"),
              Path("docs/.serde-invariants-red-run"),
              Path("docs/.source-snapshot-run"),
              Path("tools/patches/runtime-phase-red.patch"),
          ]:
              path.unlink(missing_ok=True)
          PY

      - name: Commit verified repair
        shell: bash
        run: |
          git rm .github/workflows/repair-red-ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: restore validated serde boundaries and stable CI"
          git push origin HEAD:agent/v1-production-completion
