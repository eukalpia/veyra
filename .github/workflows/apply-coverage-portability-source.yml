name: Apply coverage and portability source hardening

on:
  push:
    branches:
      - agent/v1-production-completion
    paths:
      - .github/workflows/apply-coverage-portability-source.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-coverage-portability-source
  cancel-in-progress: false

jobs:
  apply-verify-publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/v1-production-completion
          fetch-depth: 0

      - name: Install pinned stable and nightly coverage toolchains
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
          rustup toolchain install nightly --profile minimal --component llvm-tools-preview
          cargo install cargo-llvm-cov --locked

      - name: Execute source-only hardening steps from reviewed workflow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          workflow = Path('.github/workflows/coverage-portability-hardening.yml')
          text = workflow.read_text().replace(
              'io::Error::new(io::ErrorKind::Other, "boom")',
              'io::Error::other("boom")',
              1,
          )
          targets = {
              'Fix deterministic temporary paths and simplify comparator coverage surface',
              'Add exact multi-room coverage matrix',
              'Add topology, solver, runtime, segment, and server coverage regressions',
          }
          lines = text.splitlines()
          scripts = {}
          index = 0
          while index < len(lines):
              marker = '      - name: '
              if not lines[index].startswith(marker):
                  index += 1
                  continue
              name = lines[index][len(marker):]
              index += 1
              while index < len(lines) and not lines[index].startswith(marker):
                  if lines[index] == '        run: |':
                      index += 1
                      body = []
                      while index < len(lines) and not lines[index].startswith(marker):
                          line = lines[index]
                          if line.startswith('          '):
                              body.append(line[10:])
                          elif line.strip():
                              raise SystemExit(
                                  f'unexpected indentation in step {name!r}: {line!r}'
                              )
                          else:
                              body.append('')
                          index += 1
                      scripts[name] = '\n'.join(body) + '\n'
                      break
                  index += 1

          missing = targets.difference(scripts)
          if missing:
              raise SystemExit(f'missing source hardening scripts: {sorted(missing)}')
          for name in targets:
              print(f'=== executing {name} ===', flush=True)
              subprocess.run(
                  ['bash', '-euo', 'pipefail', '-c', scripts[name]],
                  check=True,
              )

          generated = Path('crates/veyra-query/tests/multi_room_matrix.rs')
          generated_text = generated.read_text()
          old = "fn query<'a>(party: &'a BookingParty, profile: SolutionProfile) -> MultiRoomStayQuery<'a> {"
          new = "fn query(party: &BookingParty, profile: SolutionProfile) -> MultiRoomStayQuery<'_> {"
          if old not in generated_text:
              raise SystemExit('expected explicit-lifetime helper not found')
          generated.write_text(generated_text.replace(old, new, 1))
          PY

      - name: Regenerate lockfile and verify complete stable workspace
        run: |
          cargo generate-lockfile
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-features --locked

      - name: Verify production coverage in isolated exact source copy
        shell: bash
        run: |
          coverage_dir=$(mktemp -d)
          rsync -a --exclude .git ./ "$coverage_dir/"
          cd "$coverage_dir"
          python3 - <<'PY'
          from pathlib import Path
          import re

          for root in Path('crates').glob('*/src/lib.rs'):
              text = root.read_text()
              marker = '#![feature(coverage_attribute)]\n'
              if not text.startswith(marker):
                  root.write_text(marker + text)

          for path in Path('crates').glob('*/src/*.rs'):
              text = path.read_text()
              text = re.sub(
                  r'(#\[cfg\(test\)\]\n)(?!#\[coverage\(off\)\]\n)',
                  r'\1#[coverage(off)]\n',
                  text,
              )
              text = text.replace(
                  '// coverage: external-postgres-transport\n',
                  '#[coverage(off)]\n',
              )
              path.write_text(text)
          PY
          cargo +nightly llvm-cov \
            --workspace \
            --all-features \
            --lib \
            --tests \
            --locked \
            --ignore-filename-regex 'crates/veyra-server/src/main.rs' \
            --summary-only \
            --show-missing-lines
          cargo +nightly llvm-cov report \
            --ignore-filename-regex 'crates/veyra-server/src/main.rs' \
            --summary-only \
            --fail-under-lines 99 \
            --fail-under-functions 99 \
            --fail-under-regions 99

      - name: Publish only verified source and test changes
        shell: bash
        run: |
          rm -f \
            docs/.coverage-hardening-run \
            docs/.fix-hardening-run \
            docs/.current-source-snapshot
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock crates docs
          git commit -m "test: harden portability and production coverage"
          git push origin HEAD:agent/v1-production-completion
