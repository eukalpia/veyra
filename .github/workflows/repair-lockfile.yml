name: Repair workspace lockfile

on:
  push:
    branches:
      - agent/v1-production-completion
    paths:
      - .github/workflows/repair-lockfile.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/v1-production-completion
      - name: Install pinned Rust
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Regenerate workspace lockfile
        run: cargo generate-lockfile
      - name: Verify locked dependency graph
        run: cargo metadata --locked --format-version 1 > /dev/null
      - name: Commit generated lockfile
        shell: bash
        run: |
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "build: synchronize Cargo lockfile"
          git push origin HEAD:agent/v1-production-completion
