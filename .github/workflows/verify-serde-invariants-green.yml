name: Verify serde invariants green

on:
  push:
    branches:
      - agent/v1-production-completion
    paths:
      - .github/workflows/verify-serde-invariants-green.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-serde-invariants-green
  cancel-in-progress: false

jobs:
  red-to-green:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/v1-production-completion
          fetch-depth: 0
      - name: Install pinned Rust
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - name: Verify locked graph
        run: |
          cargo metadata --locked --format-version 1 > /dev/null
          (cd fuzz && cargo metadata --locked --format-version 1 > /dev/null)
      - name: Apply original RED regressions in an isolated worktree state
        shell: bash
        run: |
          mapfile -t patches < <(find tools/patches -maxdepth 1 -type f -name '*red*.patch' -print | sort)
          if [ "${#patches[@]}" -eq 0 ]; then
            echo "No original RED patches found" >&2
            exit 1
          fi
          git add -A
          git commit --allow-empty -m "chore: verification anchor"
          for patch in "${patches[@]}"; do
            echo "Applying $patch"
            git apply --check "$patch"
            git apply "$patch"
          done
          cargo fmt --all
          cargo test -p veyra-types -p veyra-cdc -p veyra-runtime --all-features --locked
          cargo clippy -p veyra-types -p veyra-cdc -p veyra-runtime --all-targets --all-features --locked -- -D warnings
          git reset --hard HEAD
      - name: Persist security checkpoint and remove temporary RED harness
        shell: bash
        run: |
          mkdir -p docs/ci-checkpoints
          cat > docs/ci-checkpoints/2026-08-18-serde-invariants.md <<'EOF'
          # Serialized Invariant Qualification

          The original RED regressions for runtime admission, projection-progress LSN ordering,
          and projected-transaction LSN ordering pass against the production implementation.

          Enforced properties:

          - only a `Ready` runtime snapshot can admit queries;
          - projection progress satisfies `published <= applied <= durable <= received` after deserialization;
          - projected transactions satisfy `begin <= commit <= end` after deserialization.

          The check executes with Rust 1.97.1, locked dependencies, tests, and clippy warnings denied.
          EOF
          find .github/workflows -maxdepth 1 -type f -name '*red*.yml' -print -delete
          find tools/patches -maxdepth 1 -type f -name '*red*.patch' -print -delete 2>/dev/null || true
          git rm .github/workflows/verify-serde-invariants-green.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs .github tools 2>/dev/null || true
          git commit --amend -m "test: qualify serialized runtime and CDC invariants"
          git push --force-with-lease origin HEAD:agent/v1-production-completion
