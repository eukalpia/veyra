name: Add solver rejection tests

on:
  push:
    branches:
      - agent/v1-production-completion
    paths:
      - .github/workflows/add-solver-rejection-tests.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: add-solver-rejection-tests
  cancel-in-progress: false

jobs:
  add-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/v1-production-completion
          fetch-depth: 0
      - name: Install pinned Rust
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - name: Add bounded rejection matrix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/veyra-solver/tests/priced_solver.rs")
          text = path.read_text()
          marker = "priced_solver_rejection_matrix"
          if marker in text:
              raise SystemExit(0)
          if not text.startswith("#![allow("):
              text = "#![allow(clippy::too_many_lines)]\n\n" + text
          addition = r'''

#[test]
fn priced_solver_rejection_matrix() {
    let party = party();
    let offers = vec![room(10, 100, 0), room(11, 120, 0)];

    assert!(matches!(
        solve_priced(
            &party,
            date(2026, 9, 21),
            10,
            10,
            &offers,
            SolverConfig::default(),
        ),
        Err(veyra_solver::SolverError::InvalidStayRange)
    ));

    let duplicate = vec![offers[0].clone(), offers[0].clone()];
    assert!(matches!(
        solve_priced(
            &party,
            date(2026, 9, 21),
            10,
            11,
            &duplicate,
            SolverConfig::default(),
        ),
        Err(veyra_solver::SolverError::DuplicateRoomId(10))
    ));

    let mut invalid_age = offers[0].clone();
    invalid_age.adult_age = 0;
    assert!(matches!(
        solve_priced(
            &party,
            date(2026, 9, 21),
            10,
            11,
            &[invalid_age],
            SolverConfig::default(),
        ),
        Err(veyra_solver::SolverError::InvalidAdultAge(10))
    ));

    assert!(matches!(
        solve_priced(
            &party,
            date(2026, 9, 21),
            10,
            11,
            &[],
            SolverConfig::default(),
        ),
        Err(veyra_solver::SolverError::InvalidRoomCount(0))
    ));

    let too_many = (0..9)
        .map(|room_id| room(room_id, 100, 0))
        .collect::<Vec<_>>();
    assert!(matches!(
        solve_priced(
            &party,
            date(2026, 9, 21),
            10,
            11,
            &too_many,
            SolverConfig::default(),
        ),
        Err(veyra_solver::SolverError::InvalidRoomCount(9))
    ));

    for config in [
        SolverConfig {
            max_states: 0,
            max_solutions: 1,
        },
        SolverConfig {
            max_states: 1,
            max_solutions: 0,
        },
    ] {
        assert!(matches!(
            solve_priced(
                &party,
                date(2026, 9, 21),
                10,
                11,
                &offers,
                config,
            ),
            Err(veyra_solver::SolverError::InvalidBudget)
        ));
    }

    assert!(matches!(
        solve_priced(
            &party,
            date(2026, 9, 21),
            10,
            11,
            &offers,
            SolverConfig {
                max_states: 1,
                max_solutions: 10,
            },
        ),
        Err(veyra_solver::SolverError::StateBudgetExhausted)
    ));

    assert!(matches!(
        solve_priced(
            &party,
            date(2026, 9, 21),
            11,
            12,
            &offers,
            SolverConfig::default(),
        ),
        Err(veyra_solver::SolverError::Price(
            veyra_pricing::PricingError::OutsidePriceHorizon
        ))
    ));

    let negative = veyra_solver::RoomOffer {
        room_id: 77,
        projected_price: MoneyMicros::signed(-1),
        floor: 1,
        building: 1,
        adult_age: 18,
        occupancy_rule: policy(),
    };
    assert!(matches!(
        veyra_solver::solve(
            &party,
            date(2026, 9, 21),
            &[negative],
            SolverConfig::default(),
        ),
        Err(veyra_solver::SolverError::NegativeRoomPrice(77))
    ));
}

#[test]
fn solver_rejects_too_many_travelers_and_unprovable_hard_topology() {
    let mut many = BookingParty::builder();
    for id in 1..=17 {
        many.add_traveler(Traveler::new(
            TravelerId::new(id),
            AgeEvidence::AgeAtCheckIn(30),
            false,
        ))
        .unwrap_or_else(|_| unreachable!());
    }
    let many = many.build().unwrap_or_else(|_| unreachable!());
    assert!(matches!(
        veyra_solver::solve(
            &many,
            date(2026, 9, 21),
            &[veyra_solver::RoomOffer {
                room_id: 1,
                projected_price: money(1),
                floor: 1,
                building: 1,
                adult_age: 18,
                occupancy_rule: policy(),
            }],
            SolverConfig::default(),
        ),
        Err(veyra_solver::SolverError::TooManyTravelers(17))
    ));

    let mut topology = BookingParty::builder();
    for id in 1..=2 {
        topology
            .add_traveler(Traveler::new(
                TravelerId::new(id),
                AgeEvidence::AgeAtCheckIn(30),
                false,
            ))
            .unwrap_or_else(|_| unreachable!());
    }
    topology
        .add_rooming_intent(veyra_party::RoomingIntent {
            left: TravelerId::new(1),
            right: TravelerId::new(2),
            strength: veyra_party::ConstraintStrength::Must,
            relation: veyra_party::RoomingRelation::Near,
        })
        .unwrap_or_else(|_| unreachable!());
    let topology = topology.build().unwrap_or_else(|_| unreachable!());
    assert!(matches!(
        veyra_solver::solve(
            &topology,
            date(2026, 9, 21),
            &[
                veyra_solver::RoomOffer {
                    room_id: 1,
                    projected_price: money(1),
                    floor: 1,
                    building: 1,
                    adult_age: 18,
                    occupancy_rule: policy(),
                },
                veyra_solver::RoomOffer {
                    room_id: 2,
                    projected_price: money(1),
                    floor: 1,
                    building: 1,
                    adult_age: 18,
                    occupancy_rule: policy(),
                },
            ],
            SolverConfig::default(),
        ),
        Err(veyra_solver::SolverError::UnsupportedHardConstraint(
            veyra_party::RoomingRelation::Near
        ))
    ));
}
'''
          path.write_text(text.rstrip() + addition + "\n")
          PY
      - name: Format and verify solver
        run: |
          cargo fmt --all
          cargo test -p veyra-solver --all-features --locked
          cargo clippy -p veyra-solver --all-targets --all-features --locked -- -D warnings
      - name: Commit tests
        shell: bash
        run: |
          git rm .github/workflows/add-solver-rejection-tests.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/veyra-solver/tests/priced_solver.rs .github/workflows/add-solver-rejection-tests.yml
          git commit -m "test: qualify bounded solver rejection matrix"
          git fetch origin agent/v1-production-completion
          git rebase origin/agent/v1-production-completion
          git push origin HEAD:agent/v1-production-completion
