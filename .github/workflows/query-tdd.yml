name: Query TDD gate

on:
  push:
    branches:
      - agent/v1-production-completion
    paths:
      - .github/workflows/query-tdd.yml
      - tools/patches/v1-query-multi-room.patch
      - tools/patches/v1-query-dense-set.patch
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/v1-production-completion
      - name: Install pinned Rust
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - name: Apply multi-room implementation
        run: |
          git apply --check tools/patches/v1-query-multi-room.patch
          git apply tools/patches/v1-query-multi-room.patch
          git apply --check tools/patches/v1-query-dense-set.patch
          git apply tools/patches/v1-query-dense-set.patch
      - name: Synchronize workspace lockfile
        run: cargo generate-lockfile
      - name: Format workspace
        run: cargo fmt --all
      - name: Strict query clippy
        run: cargo clippy -p veyra-query --all-targets --all-features --locked -- -D warnings
      - name: Query tests
        run: cargo test -p veyra-query --all-features --locked
      - name: Commit verified implementation
        shell: bash
        run: |
          git rm tools/patches/v1-query-multi-room.patch tools/patches/v1-query-dense-set.patch .github/workflows/query-tdd.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock crates/veyra-query/Cargo.toml crates/veyra-query/src/lib.rs
          git commit -m "feat: orchestrate exact multi-room property search"
          git push origin HEAD:agent/v1-production-completion
