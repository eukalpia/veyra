name: Query TDD gate

on:
  push:
    branches:
      - agent/v1-production-completion
    paths:
      - .github/workflows/query-tdd.yml
      - crates/veyra-query/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  query-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/v1-production-completion
      - name: Install pinned Rust
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy
      - name: Run multi-room regression
        run: cargo test -p veyra-query --test multi_room --locked
