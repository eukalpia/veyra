name: M1 Lockfile Bootstrap

on:
  push:
    branches:
      - agent/m1-cdc

permissions:
  contents: write

concurrency:
  group: m1-lock-bootstrap-${{ github.ref }}
  cancel-in-progress: true

env:
  VEYRA_RUST_VERSION: "1.97.1"

jobs:
  generate-and-finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/m1-cdc
      - name: Install pinned stable Rust
        run: rustup toolchain install ${{ env.VEYRA_RUST_VERSION }} --profile minimal
      - name: Generate exact lockfiles
        run: |
          cargo generate-lockfile
          (cd fuzz && cargo generate-lockfile)
      - name: Commit generated lockfiles and remove bootstrap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock fuzz/Cargo.lock
          git rm .github/workflows/lock-bootstrap.yml
          git commit -m "build: lock M1 dependency graph"
          git push origin HEAD:agent/m1-cdc
