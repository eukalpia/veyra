name: Add query combinatorial corpus

on:
  push:
    branches:
      - agent/v1-production-completion
    paths:
      - .github/workflows/add-query-combinatorial-corpus.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: add-query-combinatorial-corpus
  cancel-in-progress: false

jobs:
  add-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/v1-production-completion
          fetch-depth: 0
      - name: Install pinned Rust
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - name: Add deterministic query corpus
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/veyra-query/tests/multi_room.rs")
          text = path.read_text()
          marker = "query_combinatorial_corpus_is_deterministic"
          if marker in text:
              raise SystemExit(0)
          if not text.startswith("#![allow("):
              text = "#![allow(clippy::too_many_lines, clippy::similar_names)]\n\n" + text
          helper = r'''

fn qualification_multi_query<'a>(party: &'a BookingParty) -> MultiRoomStayQuery<'a> {
    MultiRoomStayQuery {
        destination_id: 55,
        check_in_day: 10,
        check_out_day: 11,
        check_in_date: date(2026, 9, 21),
        party,
        budget: None,
        profile: SolutionProfile::Cheapest,
        solver: SolverConfig::default(),
        limit: 10,
    }
}
'''
          test = r'''

#[test]
fn query_combinatorial_corpus_is_deterministic() {
    let party = party();
    let engine = engine();
    let profiles = [
        SolutionProfile::Cheapest,
        SolutionProfile::FewestRooms,
        SolutionProfile::BestFamilyLayout,
    ];
    let budgets = [None, Some(money(0)), Some(money(219)), Some(money(220)), Some(money(10_000))];
    let ranges = [(10, 11), (10, 12), (11, 12), (10, 10)];
    let destinations = [55, 999];
    let limits = [1, 2, 10];
    let solver_configs = [
        SolverConfig::default(),
        SolverConfig {
            max_states: 1,
            max_solutions: 10,
        },
        SolverConfig {
            max_states: 50_000,
            max_solutions: 1,
        },
    ];

    for destination_id in destinations {
        for (check_in_day, check_out_day) in ranges {
            for budget in budgets {
                for profile in profiles {
                    for limit in limits {
                        for solver in solver_configs {
                            let query = MultiRoomStayQuery {
                                destination_id,
                                check_in_day,
                                check_out_day,
                                check_in_date: date(2026, 9, 21),
                                party: &party,
                                budget,
                                profile,
                                solver,
                                limit,
                            };
                            let first = engine.search_multi_room(&query);
                            let second = engine.search_multi_room(&query);
                            assert_eq!(first, second);
                        }
                    }
                }
            }
        }
    }
}

#[test]
fn availability_and_restriction_corpus_never_returns_a_partial_property_solution() {
    let party = party();
    for unavailable_room in [None, Some(0), Some(1)] {
        let mut availability = AvailabilityIndex::new(10, 5, 2).unwrap_or_else(|_| unreachable!());
        for room_id in 0..2 {
            for day in 10..15 {
                let available = unavailable_room != Some(room_id);
                availability
                    .set_available(day, room_id, available)
                    .unwrap_or_else(|_| unreachable!());
            }
        }
        let engine = SearchEngine::try_new(
            availability,
            vec![room(0, 100, 500), room(1, 120, 0)],
        )
        .unwrap_or_else(|_| unreachable!());
        let result = engine
            .search_multi_room(&qualification_multi_query(&party))
            .unwrap_or_else(|_| unreachable!());
        if unavailable_room.is_some() {
            assert!(result.hits.is_empty());
        } else {
            assert_eq!(result.hits.len(), 1);
        }
    }

    let mut availability = AvailabilityIndex::new(10, 10, 2).unwrap_or_else(|_| unreachable!());
    for room_id in 0..2 {
        for day in 10..20 {
            availability
                .set_available(day, room_id, true)
                .unwrap_or_else(|_| unreachable!());
        }
    }
    let mut first = room(0, 100, 0);
    first.prices = PriceVector::try_new(10, vec![money(100); 10], 1)
        .unwrap_or_else(|_| unreachable!());
    let mut second = room(1, 100, 0);
    second.prices = PriceVector::try_new(10, vec![money(100); 10], 1)
        .unwrap_or_else(|_| unreachable!());
    let engine = SearchEngine::try_new(availability, vec![first, second])
        .unwrap_or_else(|_| unreachable!());
    let mut query = qualification_multi_query(&party);
    query.check_out_day = 16;
    let result = engine
        .search_multi_room(&query)
        .unwrap_or_else(|_| unreachable!());
    assert!(result.hits.is_empty());
}
'''
          text = text.rstrip()
          if "fn qualification_multi_query" not in text:
              text += helper
          text += test + "\n"
          path.write_text(text)
          PY
      - name: Format and verify
        run: |
          cargo fmt --all
          cargo test -p veyra-query --all-features --locked
          cargo clippy -p veyra-query --all-targets --all-features --locked -- -D warnings
      - name: Commit corpus and remove one-shot workflow
        shell: bash
        run: |
          git rm .github/workflows/add-query-combinatorial-corpus.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/veyra-query/tests/multi_room.rs .github/workflows/add-query-combinatorial-corpus.yml
          git commit -m "test: add deterministic query qualification corpus"
          git fetch origin agent/v1-production-completion
          git rebase origin/agent/v1-production-completion
          git push origin HEAD:agent/v1-production-completion
