name: V1 final cleanup

on:
  push:
    branches:
      - agent/v1-production-completion
    paths:
      - .github/workflows/v1-final-cleanup.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v1-final-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/v1-production-completion
          fetch-depth: 0
      - name: Wait for in-flight qualification writers
        run: sleep 180
      - name: Reset to latest branch
        run: |
          git fetch origin agent/v1-production-completion
          git reset --hard origin/agent/v1-production-completion
          git clean -fd
      - name: Install pinned Rust
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - name: Remove temporary workflows and patches
        shell: bash
        run: |
          temporary=(
            repair-serde-invariant-lockfile.yml
            apply-serde-invariant-fixes.yml
            apply-serde-invariant-fixes-v2.yml
            verify-serde-invariants-green.yml
            stabilize-v1-branch.yml
            add-query-qualification-tests.yml
            add-server-boundary-tests.yml
            materialize-serde-regressions.yml
            materialize-serde-regressions-v2.yml
            materialize-serde-regressions-v3.yml
            add-error-surface-tests.yml
            add-topology-validation-tests.yml
            add-solver-rejection-tests.yml
            runtime-phase-red.yml
            projection-progress-red.yml
            projected-transaction-red.yml
            query-tdd.yml
            v1-master-functional-baseline.yml
            v1-coverage-diagnostic.yml
            v1-delayed-coverage-gate.yml
            v1-final-cleanup.yml
          )
          for file in "${temporary[@]}"; do
            rm -f ".github/workflows/$file"
          done
          find tools/patches -maxdepth 1 -type f \( -name '*red*.patch' -o -name '*v1*.patch' \) -delete 2>/dev/null || true
          rm -f docs/.source-snapshot-run
      - name: Keep snapshot workflow read-only
        shell: bash
        run: |
          cat > .github/workflows/source-snapshot.yml <<'EOF'
          name: Source snapshot

          on:
            push:
              branches:
                - agent/m0-foundation-ci
                - agent/v1-production-completion
            workflow_dispatch:

          permissions:
            contents: read

          concurrency:
            group: source-snapshot-${{ github.ref }}
            cancel-in-progress: true

          jobs:
            archive:
              name: Archive exact branch source
              runs-on: ubuntu-24.04
              steps:
                - uses: actions/checkout@v6
                - name: Create reproducible source archive
                  run: git archive --format=zip --output=veyra-source.zip HEAD
                - name: Upload exact source snapshot
                  uses: actions/upload-artifact@v4
                  with:
                    name: veyra-source-${{ github.sha }}
                    path: veyra-source.zip
                    if-no-files-found: error
          EOF
      - name: Normalize and verify clean tree
        run: |
          cargo generate-lockfile
          cargo fmt --all
          cargo metadata --locked --format-version 1 > /dev/null
          (cd fuzz && cargo metadata --locked --format-version 1 > /dev/null)
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-features --locked
      - name: Commit final cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "build: clean V1 qualification branch"
          git push origin HEAD:agent/v1-production-completion
