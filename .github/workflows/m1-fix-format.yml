name: M1 Verified Fix Formatter

on:
  push:
    branches:
      - agent/m1-cdc

permissions:
  contents: write

concurrency:
  group: m1-fix-format-${{ github.ref }}
  cancel-in-progress: true

env:
  VEYRA_RUST_VERSION: "1.97.1"

jobs:
  fix-and-format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/m1-cdc
      - name: Install pinned Rust formatter
        run: rustup toolchain install ${{ env.VEYRA_RUST_VERSION }} --profile minimal --component rustfmt
      - name: Apply codec regression fix
        shell: python
        run: |
          from pathlib import Path

          codec = Path("crates/veyra-cdc/src/codec.rs")
          text = codec.read_text()
          replacements = {
              "const HEADER_LEN: usize = 48;": "const HEADER_LEN: usize = 52;",
              "const MESSAGE_FIXED_LEN: usize = 13;": "const MESSAGE_FIXED_LEN: usize = 17;",
              "too_many[44..48].copy_from_slice(&3u32.to_le_bytes());": "too_many[48..52].copy_from_slice(&3u32.to_le_bytes());",
              "let message_tag = HEADER_LEN + WAL_FIXED_LEN + 3;\n        invalid_utf8[message_tag] = 0xFF;": "let message_tag = HEADER_LEN + WAL_FIXED_LEN + 3;\n        let prefix_start = message_tag + 1 + 8 + 4;\n        invalid_utf8[prefix_start] = 0xFF;",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"expected codec pattern not found: {old}")
              text = text.replace(old, new, 1)
          codec.write_text(text)

          durable = Path("crates/veyra-cdc/src/durable.rs")
          text = durable.read_text()
          unused = "    use std::io::{Read as _, Seek as _, Write as _};\n"
          if unused not in text:
              raise SystemExit("expected redundant durable test imports not found")
          durable.write_text(text.replace(unused, "", 1))
      - name: Canonical format
        run: cargo fmt --all
      - name: Commit fix and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/veyra-cdc
          git rm .github/workflows/m1-fix-format.yml
          git commit -m "fix: correct CDC transaction framing"
          git push origin HEAD:agent/m1-cdc
