name: Solver differential pruning gate

on:
  push:
    branches:
      - agent/v1-production-completion
    paths:
      - .github/workflows/solver-differential-tdd.yml
      - crates/veyra-solver/Cargo.toml
      - crates/veyra-solver/tests/pruning_differential.rs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/v1-production-completion
      - name: Install pinned Rust
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - name: Synchronize workspace lockfile
        run: cargo generate-lockfile
      - name: Format workspace
        run: cargo fmt --all
      - name: Strict solver clippy
        run: cargo clippy -p veyra-solver --all-targets --all-features --locked -- -D warnings
      - name: Solver tests
        env:
          PROPTEST_CASES: "256"
        run: cargo test -p veyra-solver --all-features --locked
      - name: Commit verified lockfile and remove temporary gate
        shell: bash
        run: |
          git rm .github/workflows/solver-differential-tdd.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "test: verify pruning against exhaustive reference"
          git push origin HEAD:agent/v1-production-completion
