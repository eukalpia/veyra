name: Stabilize V1 branch

on:
  push:
    branches:
      - agent/v1-production-completion
    paths:
      - .github/workflows/stabilize-v1-branch.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: veyra-v1-branch-writer
  cancel-in-progress: false

jobs:
  stabilize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/v1-production-completion
          fetch-depth: 0
      - name: Install pinned Rust
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - name: Assert invariant implementation exists
        shell: bash
        run: |
          grep -R 'serde(try_from = "ProjectionProgressWire")' crates/veyra-types crates/veyra-runtime
          grep -R 'serde(try_from = "ProjectedTransactionWire")' crates/veyra-cdc
          grep -R '::Ready' crates/veyra-runtime/src | grep 'phase' >/dev/null
      - name: Re-run original RED regressions when present
        shell: bash
        run: |
          mapfile -t patches < <(find tools/patches -maxdepth 1 -type f -name '*red*.patch' -print 2>/dev/null | sort)
          if [ "${#patches[@]}" -eq 0 ]; then
            test -f docs/ci-checkpoints/2026-08-18-serde-invariants.md
            exit 0
          fi
          git worktree add /tmp/veyra-red HEAD
          for patch in "${patches[@]}"; do
            absolute="$GITHUB_WORKSPACE/$patch"
            (cd /tmp/veyra-red && git apply --check "$absolute" && git apply "$absolute")
          done
          (cd /tmp/veyra-red && cargo fmt --all)
          (cd /tmp/veyra-red && cargo test -p veyra-types -p veyra-cdc -p veyra-runtime --all-features --locked)
          (cd /tmp/veyra-red && cargo clippy -p veyra-types -p veyra-cdc -p veyra-runtime --all-targets --all-features --locked -- -D warnings)
          git worktree remove --force /tmp/veyra-red
      - name: Make source snapshots read-only and reproducible
        shell: bash
        run: |
          cat > .github/workflows/source-snapshot.yml <<'EOF'
          name: Source snapshot

          on:
            push:
              branches:
                - agent/m0-foundation-ci
                - agent/v1-production-completion
            workflow_dispatch:

          permissions:
            contents: read

          concurrency:
            group: source-snapshot-${{ github.ref }}
            cancel-in-progress: true

          jobs:
            archive:
              name: Archive exact branch source
              runs-on: ubuntu-24.04
              steps:
                - uses: actions/checkout@v6
                - name: Create reproducible source archive
                  run: git archive --format=zip --output=veyra-source.zip HEAD
                - name: Upload exact source snapshot
                  uses: actions/upload-artifact@v4
                  with:
                    name: veyra-source-${{ github.sha }}
                    path: veyra-source.zip
                    if-no-files-found: error
          EOF
      - name: Synchronize and format
        run: |
          cargo generate-lockfile
          cargo fmt --all
          cargo metadata --locked --format-version 1 > /dev/null
          (cd fuzz && cargo metadata --locked --format-version 1 > /dev/null)
      - name: Full workspace clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Full workspace tests
        run: cargo test --workspace --all-features --locked
      - name: Record checkpoint and remove temporary harnesses
        shell: bash
        run: |
          mkdir -p docs/ci-checkpoints
          cat > docs/ci-checkpoints/2026-08-18-serde-invariants.md <<'EOF'
          # Serialized Invariant Qualification

          Verified with Rust 1.97.1 and locked dependencies:

          - query admission requires runtime phase `Ready`;
          - deserialized projection progress satisfies `published <= applied <= durable <= received`;
          - deserialized projected transactions satisfy `begin <= commit <= end`;
          - original RED regressions pass under tests and clippy with warnings denied.
          EOF
          find .github/workflows -maxdepth 1 -type f \( \
            -name 'repair-serde-invariant-lockfile.yml' -o \
            -name 'apply-serde-invariant-fixes.yml' -o \
            -name 'apply-serde-invariant-fixes-v2.yml' -o \
            -name 'verify-serde-invariants-green.yml' -o \
            -name 'runtime-phase-red.yml' -o \
            -name 'projection-progress-red.yml' -o \
            -name 'projected-transaction-red.yml' -o \
            -name 'query-tdd.yml' -o \
            -name 'stabilize-v1-branch.yml' \
          \) -print -delete
          find tools/patches -maxdepth 1 -type f -name '*red*.patch' -print -delete 2>/dev/null || true
      - name: Commit clean functional baseline
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "build: stabilize V1 functional baseline"
          git fetch origin agent/v1-production-completion
          git rebase origin/agent/v1-production-completion
          git push origin HEAD:agent/v1-production-completion
