name: V1 coverage gap report

on:
  push:
    branches:
      - agent/v1-production-completion
    paths:
      - .github/workflows/v1-coverage-gap-report.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v1-coverage-gap-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/v1-production-completion
          fetch-depth: 0
      - name: Install coverage toolchain
        run: |
          rustup toolchain install nightly --profile minimal --component llvm-tools-preview
          cargo install cargo-llvm-cov --locked
      - name: Define production denominator
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for root in Path("crates").glob("*/src/lib.rs"):
              text = root.read_text()
              marker = "#![feature(coverage_attribute)]\n"
              if not text.startswith(marker):
                  root.write_text(marker + text)
          for path in Path("crates").glob("*/src/*.rs"):
              text = path.read_text()
              text = re.sub(
                  r"(#\[cfg\(test\)\]\n)(?!#\[coverage\(off\)\]\n)",
                  r"\1#[coverage(off)]\n",
                  text,
              )
              text = text.replace(
                  "// coverage: external-postgres-transport\n",
                  "#[coverage(off)]\n",
              )
              path.write_text(text)
          PY
      - name: Measure without threshold
        run: |
          cargo +nightly llvm-cov \
            --workspace \
            --all-features \
            --lib \
            --tests \
            --locked \
            --ignore-filename-regex 'crates/veyra-server/src/main.rs' \
            --json \
            --output-path coverage.json
      - name: Produce line and function gap map
        shell: bash
        run: |
          git reset --hard HEAD
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import os
          from pathlib import Path

          raw = json.loads(Path("coverage.json").read_text())
          payload = raw["data"][0]
          root = Path.cwd().resolve()

          def percent(summary: dict, key: str) -> float:
              return float(summary[key].get("percent", 0.0))

          files = []
          for entry in payload.get("files", []):
              filename = Path(entry["filename"])
              try:
                  relative = filename.resolve().relative_to(root)
              except ValueError:
                  relative = filename
              summary = entry["summary"]
              uncovered_lines = set()
              for segment in entry.get("segments", []):
                  if len(segment) >= 4:
                      line, _column, count, has_count = segment[:4]
                      if has_count and count == 0:
                          uncovered_lines.add(int(line))
              uncovered_functions = []
              for function in entry.get("functions", []):
                  regions = function.get("regions", [])
                  if regions and all(region[4] == 0 for region in regions):
                      uncovered_functions.append(function.get("name", "<unknown>"))
              item = {
                  "path": str(relative),
                  "lines_percent": percent(summary, "lines"),
                  "functions_percent": percent(summary, "functions"),
                  "regions_percent": percent(summary, "regions"),
                  "uncovered_lines": sorted(uncovered_lines),
                  "uncovered_functions": sorted(set(uncovered_functions)),
              }
              if min(item["lines_percent"], item["functions_percent"], item["regions_percent"]) < 100.0:
                  files.append(item)
          files.sort(
              key=lambda item: (
                  min(item["lines_percent"], item["functions_percent"], item["regions_percent"]),
                  item["path"],
              )
          )
          totals = payload["totals"]
          report = {
              "measured_sha": os.environ.get("GITHUB_SHA"),
              "totals": {
                  "lines": percent(totals, "lines"),
                  "functions": percent(totals, "functions"),
                  "regions": percent(totals, "regions"),
              },
              "files": files,
          }
          destination = Path("docs/ci-checkpoints")
          destination.mkdir(parents=True, exist_ok=True)
          (destination / "v1-latest-coverage-gaps.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n"
          )
          lines = [
              "# V1 Latest Coverage Gaps",
              "",
              f"Measured SHA: `{report['measured_sha']}`",
              "",
              f"- Lines: {report['totals']['lines']:.2f}%",
              f"- Functions: {report['totals']['functions']:.2f}%",
              f"- Regions: {report['totals']['regions']:.2f}%",
              "",
          ]
          for item in files:
              lines.extend(
                  [
                      f"## `{item['path']}`",
                      "",
                      f"- Lines: {item['lines_percent']:.2f}%",
                      f"- Functions: {item['functions_percent']:.2f}%",
                      f"- Regions: {item['regions_percent']:.2f}%",
                      f"- Uncovered lines: {', '.join(map(str, item['uncovered_lines'])) or 'none'}",
                      "- Uncovered functions:",
                  ]
              )
              lines.extend(
                  f"  - `{name}`" for name in item["uncovered_functions"]
              )
              lines.append("")
          (destination / "v1-latest-coverage-gaps.md").write_text("\n".join(lines) + "\n")
          PY
      - name: Commit report and remove one-shot workflow
        shell: bash
        run: |
          git rm .github/workflows/v1-coverage-gap-report.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ci-checkpoints .github/workflows/v1-coverage-gap-report.yml
          git commit -m "test: record latest production coverage gaps"
          git fetch origin agent/v1-production-completion
          git rebase origin/agent/v1-production-completion
          git push origin HEAD:agent/v1-production-completion
      - uses: actions/upload-artifact@v4
        with:
          name: v1-coverage-gap-map-${{ github.sha }}
          path: coverage.json
          if-no-files-found: error
