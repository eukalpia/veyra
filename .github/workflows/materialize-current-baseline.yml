name: Materialize current baseline

on:
  push:
    branches:
      - agent/v1-production-completion
    paths:
      - .github/workflows/materialize-current-baseline.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-current-red
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/v1-production-completion
          fetch-depth: 0
      - name: Install pinned Rust
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - name: Repair mechanics and capture exact semantic gates
        id: gates
        shell: bash
        run: |
          set +e
          mkdir -p docs/ci/current-baseline
          cargo fmt --all > docs/ci/current-baseline/format-apply.log 2>&1
          FORMAT_APPLY=$?
          cargo generate-lockfile > docs/ci/current-baseline/lockfile-generate.log 2>&1
          LOCK_GENERATE=$?
          cargo fmt --all -- --check > docs/ci/current-baseline/format-check.log 2>&1
          FORMAT_CHECK=$?
          cargo metadata --locked --format-version 1 > /dev/null 2> docs/ci/current-baseline/workspace-metadata.log
          WORKSPACE_METADATA=$?
          (cd fuzz && cargo metadata --locked --format-version 1 > /dev/null) 2> docs/ci/current-baseline/fuzz-metadata.log
          FUZZ_METADATA=$?
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings > docs/ci/current-baseline/clippy.log 2>&1
          CLIPPY=$?
          cargo test --workspace --all-features --locked > docs/ci/current-baseline/tests.log 2>&1
          TESTS=$?
          python3 - <<PY
          import json
          from pathlib import Path
          values = {
              "format_apply": $FORMAT_APPLY,
              "lockfile_generate": $LOCK_GENERATE,
              "format_check": $FORMAT_CHECK,
              "workspace_metadata": $WORKSPACE_METADATA,
              "fuzz_metadata": $FUZZ_METADATA,
              "clippy": $CLIPPY,
              "tests": $TESTS,
          }
          passed = all(value == 0 for value in values.values())
          payload = {
              "sha_before_materialization": "${GITHUB_SHA}",
              "passed": passed,
              "gates": values,
          }
          Path("docs/ci/current-baseline/status.json").write_text(
              json.dumps(payload, indent=2) + "\n"
          )
          marker = "GREEN" if passed else "RED"
          Path(f"docs/ci/current-baseline/{marker}").write_text(
              json.dumps(payload, indent=2) + "\n"
          )
          other = Path(f"docs/ci/current-baseline/{'RED' if passed else 'GREEN'}")
          if other.exists():
              other.unlink()
          PY
          printf 'passed=%s\n' "$([ "$FORMAT_APPLY" -eq 0 ] && [ "$LOCK_GENERATE" -eq 0 ] && [ "$FORMAT_CHECK" -eq 0 ] && [ "$WORKSPACE_METADATA" -eq 0 ] && [ "$FUZZ_METADATA" -eq 0 ] && [ "$CLIPPY" -eq 0 ] && [ "$TESTS" -eq 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Keep concise diagnostic tails
        shell: bash
        run: |
          for file in docs/ci/current-baseline/*.log; do
            tail -n 160 "$file" > "$file.tail"
            rm "$file"
            mv "$file.tail" "$file"
          done
      - name: Commit repaired tree and exact baseline result
        shell: bash
        run: |
          rm -f .github/workflows/repair-current-red.yml
          rm -f .github/workflows/repair-current-red-v2.yml
          rm -f .github/workflows/autofix-current-lints.yml
          git rm .github/workflows/materialize-current-baseline.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ci: materialize repaired current baseline"
          git push origin HEAD:agent/v1-production-completion
      - name: Enforce captured result after publication
        if: steps.gates.outputs.passed != 'true'
        run: exit 1
