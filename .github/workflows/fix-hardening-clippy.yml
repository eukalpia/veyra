name: Fix hardening Clippy regression

on:
  push:
    branches:
      - agent/v1-production-completion
    paths:
      - .github/workflows/fix-hardening-clippy.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/v1-production-completion
      - name: Apply minimal Clippy correction
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/coverage-portability-hardening.yml')
          text = path.read_text()
          old = 'io::Error::new(io::ErrorKind::Other, "boom")'
          new = 'io::Error::other("boom")'
          if old not in text:
              raise SystemExit('expected Clippy regression pattern not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit corrected hardening gate
        shell: bash
        run: |
          git rm .github/workflows/fix-hardening-clippy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/coverage-portability-hardening.yml
          git commit -m "ci: fix hardening Clippy regression"
          git push origin HEAD:agent/v1-production-completion
