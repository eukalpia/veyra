name: Query spatial TDD gate

on:
  push:
    branches:
      - agent/v1-production-completion
    paths:
      - .github/workflows/query-spatial-tdd.yml
      - tools/staged/apply_query_spatial.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/v1-production-completion
      - name: Install pinned Rust
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - name: Install spatial query implementation
        run: python3 tools/staged/apply_query_spatial.py
      - name: Format workspace
        run: cargo fmt --all
      - name: Strict query clippy
        run: cargo clippy -p veyra-query --all-targets --all-features --locked -- -D warnings
      - name: Query tests
        run: cargo test -p veyra-query --all-features --locked
      - name: Commit verified spatial query implementation
        shell: bash
        run: |
          git rm tools/staged/apply_query_spatial.py .github/workflows/query-spatial-tdd.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/veyra-query/src/lib.rs
          git commit -m "feat: project room topology into multi-room search"
          git push origin HEAD:agent/v1-production-completion
