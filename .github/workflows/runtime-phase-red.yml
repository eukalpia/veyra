name: Runtime phase RED gate

on:
  push:
    branches:
      - agent/v1-production-completion
    paths:
      - .github/workflows/runtime-phase-red.yml
      - tools/patches/runtime-phase-red.patch
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prove-regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/v1-production-completion
      - name: Install pinned Rust
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Apply regression test only
        run: git apply --check tools/patches/runtime-phase-red.patch && git apply tools/patches/runtime-phase-red.patch
      - name: Prove current implementation fails closed regression
        run: cargo test -p veyra-runtime malformed_non_ready_snapshot_without_reason_fails_closed --locked -- --exact
      - name: Record RED run locator
        if: always()
        shell: bash
        run: |
          git reset --hard HEAD
          printf '%s\n%s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > docs/.runtime-phase-red-run
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/.runtime-phase-red-run
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "ci: record runtime phase RED run"
          git push origin HEAD:agent/v1-production-completion
