name: Format and verify region matrix

on:
  push:
    branches:
      - agent/m0-foundation-ci
    paths:
      - .github/workflows/format-region-matrix.yml

permissions:
  contents: write

concurrency:
  group: format-region-matrix
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/m0-foundation-ci
          fetch-depth: 0
      - name: Format and verify
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
          cargo fmt --all
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-features --locked
      - name: Commit formatted verified tests and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/format-region-matrix.yml
          git add crates/veyra-cdc/tests/recovery_region_matrix.rs \
                  crates/veyra-pricing/tests/region_matrix.rs \
                  crates/veyra-restrictions/tests/region_matrix.rs \
                  crates/veyra-segment/tests/error_surface_matrix.rs
          git config user.name "Veyra CI"
          git config user.email "120781817+eukalpia@users.noreply.github.com"
          git commit -m "test: verify production branch region matrix"
          git push origin HEAD:agent/m0-foundation-ci
