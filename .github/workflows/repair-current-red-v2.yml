name: Repair current red baseline v2

on:
  push:
    branches:
      - agent/v1-production-completion
    paths:
      - .github/workflows/repair-current-red-v2.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-current-red
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/v1-production-completion
          fetch-depth: 0
      - name: Install pinned Rust
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - name: Apply mechanical repairs
        shell: bash
        run: |
          cargo fmt --all
          cargo generate-lockfile
          cargo metadata --locked --format-version 1 > /dev/null
          (cd fuzz && cargo metadata --locked --format-version 1 > /dev/null)
      - name: Commit mechanical repairs before semantic verification
        shell: bash
        run: |
          rm -f .github/workflows/repair-current-red.yml
          git rm .github/workflows/repair-current-red-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ci: repair formatting and locked dependency graph"
          git push origin HEAD:agent/v1-production-completion
      - name: Verify clippy on committed tree
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Verify workspace tests on committed tree
        run: cargo test --workspace --all-features --locked
