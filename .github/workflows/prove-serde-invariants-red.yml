name: Prove serde invariants RED

on:
  push:
    branches:
      - agent/v1-production-completion
    paths:
      - .github/workflows/prove-serde-invariants-red.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  red-and-lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/v1-production-completion
      - name: Install pinned Rust
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Synchronize dependency graph for the test harness
        run: cargo generate-lockfile
      - name: Prove all three unchecked-deserialization regressions exist
        shell: bash
        run: |
          set +e
          cargo test -p veyra-types --test serde_invariants
          types_rc=$?
          cargo test -p veyra-runtime --test serde_invariants
          runtime_rc=$?
          cargo test -p veyra-cdc --test serde_invariants
          cdc_rc=$?
          set -e
          printf 'types=%s runtime=%s cdc=%s\n' "$types_rc" "$runtime_rc" "$cdc_rc"
          if [ "$types_rc" -eq 0 ] || [ "$runtime_rc" -eq 0 ] || [ "$cdc_rc" -eq 0 ]; then
            echo "At least one regression test unexpectedly passed before the fix"
            exit 1
          fi
          echo "RED confirmed: every invalid serialized state was accepted by the current implementation"
      - name: Commit synchronized lockfile and remove temporary RED machinery
        shell: bash
        run: |
          git rm .github/workflows/prove-serde-invariants-red.yml
          if [ -f .github/workflows/runtime-phase-red.yml ]; then
            git rm .github/workflows/runtime-phase-red.yml
          fi
          if [ -f tools/patches/runtime-phase-red.patch ]; then
            git rm tools/patches/runtime-phase-red.patch
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "build: synchronize serde invariant test dependencies"
          git push origin HEAD:agent/v1-production-completion
