name: Format current coverage pass

on:
  push:
    branches:
      - agent/m0-foundation-ci

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/m0-foundation-ci
          fetch-depth: 0
      - name: Format workspace
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt
          cargo fmt --all
      - name: Commit formatting and remove helper
        run: |
          git rm .github/workflows/format-current-coverage-pass.yml
          git config user.name "eukalpia"
          git config user.email "120781817+eukalpia@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then exit 1; fi
          git commit -m "style: format production coverage pass"
          git push origin HEAD:agent/m0-foundation-ci
