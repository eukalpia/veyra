name: Repair current red baseline

on:
  push:
    branches:
      - agent/v1-production-completion
    paths:
      - .github/workflows/repair-current-red.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-current-red
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/v1-production-completion
          fetch-depth: 0
      - name: Install pinned Rust
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - name: Format workspace
        run: cargo fmt --all
      - name: Regenerate workspace lockfile
        run: cargo generate-lockfile
      - name: Verify locked graphs
        shell: bash
        run: |
          cargo metadata --locked --format-version 1 > /dev/null
          (cd fuzz && cargo metadata --locked --format-version 1 > /dev/null)
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Workspace tests
        run: cargo test --workspace --all-features --locked
      - name: Commit verified baseline repair
        shell: bash
        run: |
          git rm .github/workflows/repair-current-red.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock crates fuzz
          if git diff --cached --quiet; then
            echo "No baseline changes required"
            exit 0
          fi
          git commit -m "ci: repair formatting and locked baseline"
          git push origin HEAD:agent/v1-production-completion
