name: CI

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  VEYRA_RUST_VERSION: "1.97.1"

jobs:
  commit-lockfiles:
    name: Commit lockfiles (bootstrap)
    if: github.event_name == 'push' && github.ref == 'refs/heads/agent/m0-foundation-ci'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
      - name: Detect existing committed lockfiles
        id: lock-state
        shell: bash
        run: |
          if git ls-files --error-unmatch Cargo.lock fuzz/Cargo.lock >/dev/null 2>&1; then
            echo "tracked=true" >> "$GITHUB_OUTPUT"
          else
            echo "tracked=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install pinned stable Rust
        if: steps.lock-state.outputs.tracked != 'true'
        run: rustup toolchain install ${{ env.VEYRA_RUST_VERSION }} --profile minimal
      - name: Generate and commit lockfiles
        if: steps.lock-state.outputs.tracked != 'true'
        shell: bash
        run: |
          cargo generate-lockfile
          (cd fuzz && cargo generate-lockfile)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock fuzz/Cargo.lock
          git diff --cached --quiet && exit 0
          git commit -m "build: commit Cargo lockfiles"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  lockfile:
    name: Generate lockfiles
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned stable Rust
        run: rustup toolchain install ${{ env.VEYRA_RUST_VERSION }} --profile minimal
      - name: Generate workspace lockfile
        run: cargo generate-lockfile
      - name: Generate fuzz lockfile
        working-directory: fuzz
        run: cargo generate-lockfile
      - name: Upload generated lockfiles
        uses: actions/upload-artifact@v4
        with:
          name: generated-lockfiles
          path: |
            Cargo.lock
            fuzz/Cargo.lock
          if-no-files-found: error
          retention-days: 1

  portable:
    name: Portable / ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned stable Rust
        run: rustup toolchain install ${{ env.VEYRA_RUST_VERSION }} --profile minimal --component rustfmt --component clippy
      - name: Generate deterministic dependency lock
        run: cargo generate-lockfile
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --workspace --all-features --locked

  nextest:
    name: Nextest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned stable Rust
        run: rustup toolchain install ${{ env.VEYRA_RUST_VERSION }} --profile minimal
      - name: Generate deterministic dependency lock
        run: cargo generate-lockfile
      - name: Install cargo-nextest
        run: cargo install cargo-nextest --locked
      - name: Run nextest
        run: cargo nextest run --workspace --all-features --locked

  coverage:
    name: Coverage >= 99%
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned stable Rust with coverage tools
        run: rustup toolchain install ${{ env.VEYRA_RUST_VERSION }} --profile minimal --component llvm-tools-preview
      - name: Generate deterministic dependency lock
        run: cargo generate-lockfile
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      - name: Enforce library coverage
        run: >
          cargo llvm-cov
          --workspace
          --all-features
          --lib
          --fail-under-lines 99
          --fail-under-functions 99
          --fail-under-regions 99
          --lcov
          --output-path lcov.info
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: error

  security:
    name: Dependency policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned stable Rust
        run: rustup toolchain install ${{ env.VEYRA_RUST_VERSION }} --profile minimal
      - name: Generate deterministic dependency lock
        run: cargo generate-lockfile
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Deny policy
        run: cargo deny check
      - name: Advisory audit
        run: cargo audit --deny warnings

  docs:
    name: Rustdoc warnings
    runs-on: ubuntu-24.04
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned stable Rust
        run: rustup toolchain install ${{ env.VEYRA_RUST_VERSION }} --profile minimal
      - name: Generate deterministic dependency lock
        run: cargo generate-lockfile
      - name: Build documentation
        run: cargo doc --workspace --all-features --no-deps --locked

  miri:
    name: Miri / veyra-types
    runs-on: ubuntu-24.04
    env:
      PROPTEST_CASES: "16"
    steps:
      - uses: actions/checkout@v6
      - name: Install nightly Miri
        run: rustup toolchain install nightly --profile minimal --component miri
      - name: Generate deterministic dependency lock
        run: cargo generate-lockfile
      - name: Run Miri
        run: cargo +nightly miri test -p veyra-types --lib -- --skip any_ordered_chain_is_accepted

  fuzz-smoke:
    name: Fuzz smoke / projection progress
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install nightly Rust
        run: rustup toolchain install nightly --profile minimal
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Generate fuzz dependency lock
        working-directory: fuzz
        run: cargo generate-lockfile
      - name: Run bounded fuzz smoke
        working-directory: fuzz
        run: cargo +nightly fuzz run projection_progress -- -runs=512
