name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VEYRA_RUST_VERSION: "1.97.1"

jobs:
  bootstrap-lockfile:
    name: Bootstrap and validate workspace lockfile
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/m0-foundation-ci
      - name: Install pinned stable Rust
        run: rustup toolchain install ${{ env.VEYRA_RUST_VERSION }} --profile minimal --component rustfmt --component clippy
      - name: Generate workspace lockfile from manifests
        run: cargo generate-lockfile
      - name: Canonicalize checked test fixture
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("crates/veyra-cdc/src/pgoutput_v1.rs")
          text = path.read_text()
          old = 'huge.extend_from_slice(&((MAX_COLUMN_BYTES as u32) + 1).to_be_bytes());'
          new = '''let oversized = u32::try_from(MAX_COLUMN_BYTES)
              .unwrap_or(u32::MAX)
              .saturating_add(1);
          huge.extend_from_slice(&oversized.to_be_bytes());'''
          if old not in text:
              raise SystemExit("expected pgoutput fixture not found")
          path.write_text(text.replace(old, new))
          PY
      - name: Canonicalize formatting
        run: cargo fmt --all
      - name: Verify formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --all-features --locked
      - name: Verify generated graph
        run: cargo metadata --locked --format-version 1 --no-deps
      - name: Commit canonical sources and lockfile when changed
        shell: bash
        run: |
          paths=(Cargo.lock crates/veyra-cdc crates/veyra-segment crates/veyra-storage crates/veyra-availability)
          if git diff --quiet -- "${paths[@]}"; then
            echo "Sources and Cargo.lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${paths[@]}"
          git commit -m "build: canonicalize vertical slice and lockfile"
          git push origin HEAD:agent/m0-foundation-ci
