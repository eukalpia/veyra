name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  VEYRA_RUST_VERSION: "1.97.1"

jobs:
  lockfiles:
    name: Lockfile integrity
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned stable Rust
        run: rustup toolchain install ${{ env.VEYRA_RUST_VERSION }} --profile minimal
      - name: Verify workspace lockfile
        run: cargo metadata --locked --format-version 1
      - name: Verify fuzz lockfile
        working-directory: fuzz
        run: cargo metadata --locked --format-version 1

  portable:
    name: Portable / ${{ matrix.target }}
    needs: lockfiles
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned stable Rust
        run: rustup toolchain install ${{ env.VEYRA_RUST_VERSION }} --profile minimal --component rustfmt --component clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --all-features --locked

  nextest:
    name: Nextest
    needs: lockfiles
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned stable Rust
        run: rustup toolchain install ${{ env.VEYRA_RUST_VERSION }} --profile minimal
      - name: Install cargo-nextest
        run: cargo install cargo-nextest --locked
      - name: Run nextest
        run: cargo nextest run --workspace --all-features --locked

  coverage:
    name: Coverage >= 99%
    needs: lockfiles
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install nightly coverage toolchain
        run: rustup toolchain install nightly --profile minimal --component llvm-tools-preview
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      - name: Define the hermetic production-core denominator
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          crate_roots = list(Path("crates").glob("*/src/lib.rs"))
          for root in crate_roots:
              text = root.read_text()
              marker = "#![feature(coverage_attribute)]\n"
              if not text.startswith(marker):
                  root.write_text(marker + text)

          for path in Path("crates").glob("*/src/*.rs"):
              text = path.read_text()
              text = re.sub(
                  r"(#\[cfg\(test\)\]\n)(?!#\[coverage\(off\)\]\n)",
                  r"\1#[coverage(off)]\n",
                  text,
              )
              text = text.replace(
                  "// coverage: external-postgres-transport\n",
                  "#[coverage(off)]\n",
              )
              path.write_text(text)
          PY
      - name: Measure production coverage
        run: >
          cargo +nightly llvm-cov
          --workspace
          --all-features
          --lib
          --tests
          --locked
          --ignore-filename-regex 'crates/veyra-server/src/main.rs'
          --summary-only
          --show-missing-lines
      - name: Generate LCOV report
        run: >
          cargo +nightly llvm-cov report
          --ignore-filename-regex 'crates/veyra-server/src/main.rs'
          --lcov
          --output-path lcov.info
      - name: Generate LLVM JSON report
        run: >
          cargo +nightly llvm-cov report
          --ignore-filename-regex 'crates/veyra-server/src/main.rs'
          --json
          --output-path coverage.json
      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            lcov.info
            coverage.json
          if-no-files-found: error
      - name: Enforce production coverage
        run: >
          cargo +nightly llvm-cov report
          --ignore-filename-regex 'crates/veyra-server/src/main.rs'
          --summary-only
          --fail-under-lines 99
          --fail-under-functions 99
          --fail-under-regions 99

  security:
    name: Dependency policy
    needs: lockfiles
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned stable Rust
        run: rustup toolchain install ${{ env.VEYRA_RUST_VERSION }} --profile minimal
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Verify locked dependency graph
        run: cargo metadata --locked --format-version 1
      - name: Deny policy
        run: cargo deny check
      - name: Advisory audit
        run: cargo audit --deny warnings

  docs:
    name: Rustdoc warnings
    needs: lockfiles
    runs-on: ubuntu-24.04
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned stable Rust
        run: rustup toolchain install ${{ env.VEYRA_RUST_VERSION }} --profile minimal
      - name: Build documentation
        run: cargo doc --workspace --all-features --no-deps --locked

  miri:
    name: Miri / veyra-types
    needs: lockfiles
    runs-on: ubuntu-24.04
    env:
      PROPTEST_CASES: "16"
    steps:
      - uses: actions/checkout@v6
      - name: Install nightly Miri
        run: rustup toolchain install nightly --profile minimal --component miri
      - name: Run Miri
        run: cargo +nightly miri test -p veyra-types --lib --locked -- --skip any_ordered_chain_is_accepted

  fuzz-smoke:
    name: Fuzz smoke / projection progress
    needs: lockfiles
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install nightly Rust
        run: rustup toolchain install nightly --profile minimal
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Verify fuzz lockfile
        working-directory: fuzz
        run: cargo metadata --locked --format-version 1
      - name: Run bounded fuzz smoke
        working-directory: fuzz
        run: cargo +nightly fuzz run projection_progress -- -runs=512
