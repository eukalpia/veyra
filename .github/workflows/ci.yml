name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  VEYRA_RUST_VERSION: "1.97.1"

jobs:
  lockfiles:
    name: Lockfile integrity
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned stable Rust
        run: rustup toolchain install ${{ env.VEYRA_RUST_VERSION }} --profile minimal
      - name: Verify workspace lockfile
        run: cargo metadata --locked --format-version 1 --no-deps
      - name: Verify fuzz lockfile
        working-directory: fuzz
        run: cargo metadata --locked --format-version 1 --no-deps

  portable:
    name: Portable / ${{ matrix.target }}
    needs: lockfiles
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned stable Rust
        run: rustup toolchain install ${{ env.VEYRA_RUST_VERSION }} --profile minimal --component rustfmt --component clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --all-features --locked

  postgres-cdc:
    name: PostgreSQL CDC integration
    needs: lockfiles
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.10-bookworm
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: veyra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d veyra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
        volumes: []
    env:
      VEYRA_TEST_POSTGRES_URL: "host=127.0.0.1 port=5432 user=postgres password=postgres dbname=veyra"
    steps:
      - uses: actions/checkout@v6
      - name: Enable logical replication
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d veyra -c "ALTER SYSTEM SET wal_level = logical;"
          psql -h 127.0.0.1 -U postgres -d veyra -c "ALTER SYSTEM SET max_replication_slots = 16;"
          psql -h 127.0.0.1 -U postgres -d veyra -c "ALTER SYSTEM SET max_wal_senders = 16;"
          docker restart ${{ job.services.postgres.id }}
          for i in {1..30}; do
            pg_isready -h 127.0.0.1 -U postgres -d veyra && break
            sleep 1
          done
      - name: Install pinned stable Rust
        run: rustup toolchain install ${{ env.VEYRA_RUST_VERSION }} --profile minimal
      - name: Run PostgreSQL CDC acceptance test
        run: cargo test -p veyra-cdc --test postgres_cdc --locked -- --nocapture

  nextest:
    name: Nextest
    needs: lockfiles
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned stable Rust
        run: rustup toolchain install ${{ env.VEYRA_RUST_VERSION }} --profile minimal
      - name: Install cargo-nextest
        run: cargo install cargo-nextest --locked
      - name: Run nextest
        run: cargo nextest run --workspace --all-features --locked

  coverage:
    name: Coverage >= 99%
    needs: lockfiles
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.10-bookworm
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: veyra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d veyra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      VEYRA_TEST_POSTGRES_URL: "host=127.0.0.1 port=5432 user=postgres password=postgres dbname=veyra"
    steps:
      - uses: actions/checkout@v6
      - name: Enable logical replication
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d veyra -c "ALTER SYSTEM SET wal_level = logical;"
          psql -h 127.0.0.1 -U postgres -d veyra -c "ALTER SYSTEM SET max_replication_slots = 16;"
          psql -h 127.0.0.1 -U postgres -d veyra -c "ALTER SYSTEM SET max_wal_senders = 16;"
          docker restart ${{ job.services.postgres.id }}
          for i in {1..30}; do
            pg_isready -h 127.0.0.1 -U postgres -d veyra && break
            sleep 1
          done
      - name: Install pinned stable Rust with coverage tools
        run: rustup toolchain install ${{ env.VEYRA_RUST_VERSION }} --profile minimal --component llvm-tools-preview
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      - name: Report and enforce coverage
        run: >
          cargo llvm-cov
          --workspace
          --all-features
          --lib
          --tests
          --locked
          --summary-only
          --show-missing-lines
          --fail-under-lines 99
          --fail-under-functions 99
          --fail-under-regions 99
      - name: Generate LCOV report
        run: cargo llvm-cov report --lcov --output-path lcov.info
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: error

  security:
    name: Dependency policy
    needs: lockfiles
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned stable Rust
        run: rustup toolchain install ${{ env.VEYRA_RUST_VERSION }} --profile minimal
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Verify locked dependency graph
        run: cargo metadata --locked --format-version 1 --no-deps
      - name: Deny policy
        run: cargo deny check
      - name: Advisory audit
        run: cargo audit --deny warnings

  docs:
    name: Rustdoc warnings
    needs: lockfiles
    runs-on: ubuntu-24.04
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned stable Rust
        run: rustup toolchain install ${{ env.VEYRA_RUST_VERSION }} --profile minimal
      - name: Build documentation
        run: cargo doc --workspace --all-features --no-deps --locked

  miri:
    name: Miri / deterministic core
    needs: lockfiles
    runs-on: ubuntu-24.04
    env:
      PROPTEST_CASES: "16"
    steps:
      - uses: actions/checkout@v6
      - name: Install nightly Miri
        run: rustup toolchain install nightly --profile minimal --component miri
      - name: Run Miri / types
        run: cargo +nightly miri test -p veyra-types --lib --locked -- --skip any_ordered_chain_is_accepted
      - name: Run Miri / CDC pure core
        run: cargo +nightly miri test -p veyra-cdc --lib --locked -- assembler::tests codec::tests model::tests progress::tests

  fuzz-smoke:
    name: Fuzz smoke / parsers
    needs: lockfiles
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install nightly Rust
        run: rustup toolchain install nightly --profile minimal
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Verify fuzz lockfile
        working-directory: fuzz
        run: cargo metadata --locked --format-version 1 --no-deps
      - name: Run projection progress fuzz smoke
        working-directory: fuzz
        run: cargo +nightly fuzz run projection_progress -- -runs=512
      - name: Run CDC batch decoder fuzz smoke
        working-directory: fuzz
        run: cargo +nightly fuzz run cdc_batch_decode -- -runs=1024
