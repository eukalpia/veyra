name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VEYRA_RUST_VERSION: "1.97.1"

jobs:
  bootstrap-lockfile:
    name: Bootstrap workspace lockfile
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned stable Rust
        run: rustup toolchain install ${{ env.VEYRA_RUST_VERSION }} --profile minimal
      - name: Generate workspace lockfile from manifests
        run: cargo generate-lockfile
      - name: Verify generated graph
        run: cargo metadata --locked --format-version 1 --no-deps
      - name: Upload workspace lockfile
        uses: actions/upload-artifact@v4
        with:
          name: workspace-lockfile
          path: Cargo.lock
          if-no-files-found: error
