name: Add server semantic matrix

on:
  push:
    branches:
      - agent/v1-production-completion
    paths:
      - .github/workflows/add-server-semantic-matrix.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: add-server-semantic-matrix
  cancel-in-progress: false

jobs:
  add-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/v1-production-completion
          fetch-depth: 0
      - name: Install pinned Rust
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - name: Derive semantic rejection corpus from valid fixture
        shell: bash
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import copy
          import json
          import re
          from pathlib import Path

          path = Path("crates/veyra-server/tests/query_boundary.rs")
          text = path.read_text()
          marker = "http_semantic_rejection_matrix"
          if marker in text:
              raise SystemExit(0)

          helper_matches = re.findall(r"let\s+\w+\s*=\s*([A-Za-z_][A-Za-z0-9_]*)\(\)\s*(\.await)?\s*;", text)
          if not helper_matches:
              raise RuntimeError("zero-argument app fixture not found")
          helper, await_suffix = helper_matches[0]
          helper_call = f"{helper}()" + (".await" if await_suffix else "")

          paths = re.findall(r"\.uri\(\s*\"([^\"]+)\"\s*\)", text)
          query_paths = [candidate for candidate in paths if "query" in candidate or "search" in candidate]
          if not query_paths:
              raise RuntimeError(f"query path not found: {paths}")
          query_path = query_paths[0]

          candidates = []
          for match in re.finditer(r'r(?P<hashes>#+)?"(?P<body>.*?)"(?P=hashes)', text, re.S):
              body = match.group("body")
              try:
                  value = json.loads(body)
              except json.JSONDecodeError:
                  continue
              if isinstance(value, dict):
                  candidates.append(value)
          for match in re.finditer(r'"((?:\\.|[^"\\])*)"', text, re.S):
              raw = match.group(1)
              if "{" not in raw:
                  continue
              try:
                  value = json.loads(bytes(raw, "utf-8").decode("unicode_escape"))
              except (json.JSONDecodeError, UnicodeDecodeError):
                  continue
              if isinstance(value, dict):
                  candidates.append(value)
          if not candidates:
              raise RuntimeError("no JSON object fixture found")
          valid = max(candidates, key=lambda value: len(json.dumps(value)))

          mutations = []
          for key in list(valid):
              missing = copy.deepcopy(valid)
              missing.pop(key, None)
              mutations.append((f"missing_{key}", missing))
          for key, value in [
              ("limit", 0),
              ("destination_id", None),
              ("budget", -1),
          ]:
              if key in valid:
                  mutated = copy.deepcopy(valid)
                  mutated[key] = value
                  mutations.append((f"invalid_{key}", mutated))
          if "check_in_day" in valid and "check_out_day" in valid:
              mutated = copy.deepcopy(valid)
              mutated["check_out_day"] = mutated["check_in_day"]
              mutations.append(("invalid_stay", mutated))
          if "party" in valid:
              mutated = copy.deepcopy(valid)
              mutated["party"] = []
              mutations.append(("empty_party", mutated))

          corpus = ",\n        ".join(
              f'(r#"{json.dumps(value, separators=(",", ":"))}"#, "{name}")'
              for name, value in mutations
          )
          if not corpus:
              raise RuntimeError("semantic mutation corpus is empty")

          addition = f'''

use axum::body::Body as SemanticBody;
use axum::http::{{Method as SemanticMethod, Request as SemanticRequest, StatusCode as SemanticStatus}};
use tower::ServiceExt as SemanticServiceExt;

#[tokio::test]
async fn http_semantic_rejection_matrix() {{
    let app = {helper_call};
    let corpus = [
        {corpus}
    ];
    for (body, case_name) in corpus {{
        let request = SemanticRequest::builder()
            .method(SemanticMethod::POST)
            .uri("{query_path}")
            .header("content-type", "application/json")
            .body(SemanticBody::from(body))
            .unwrap_or_else(|_| unreachable!());
        let response = app
            .clone()
            .oneshot(request)
            .await
            .unwrap_or_else(|_| unreachable!());
        assert!(
            response.status().is_client_error(),
            "{{case_name}} unexpectedly returned {{}}",
            response.status()
        );
        assert_ne!(response.status(), SemanticStatus::INTERNAL_SERVER_ERROR);
    }}
}}
'''
          path.write_text(text.rstrip() + addition + "\n")
          PY
      - name: Format and verify server
        run: |
          cargo fmt --all
          cargo test -p veyra-server --all-features --locked
          cargo clippy -p veyra-server --all-targets --all-features --locked -- -D warnings
      - name: Commit semantic matrix
        shell: bash
        run: |
          git rm .github/workflows/add-server-semantic-matrix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/veyra-server/tests/query_boundary.rs .github/workflows/add-server-semantic-matrix.yml
          git commit -m "test: qualify HTTP semantic rejection matrix"
          git fetch origin agent/v1-production-completion
          git rebase origin/agent/v1-production-completion
          git push origin HEAD:agent/v1-production-completion
